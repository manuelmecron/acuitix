<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Calage Séquentiel Interactif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            text-align: center;
            user-select: none;
        }
        h1 { font-size: 1.1rem; margin-bottom: 10px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 10px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 600px;
            position: relative;
        }
        canvas {
            width: 100%;
            max-height: 40vh;
            object-fit: contain;
            display: none;
            cursor: crosshair;
            touch-action: none;
        }
        #status-text { font-size: 0.95rem; color: #ffc107; margin-bottom: 10px; font-weight: bold; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 8px;
        }
        #file-input { display: none; }
        
        /* Panneau de contrôle directionnel */
        .adjust-panel {
            display: none;
            background: #333;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 180px;
            margin: 8px auto;
        }
        .adjust-grid button {
            padding: 12px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .adjust-grid button:active { background: #007bff; }
    </style>
</head>
<body>

    <h1>Acuitix - Calage Séquentiel</h1>

    <div class="box">
        <p id="status-text">1. Prenez la photo globale de la plaque.</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <!-- Panneau d'ajustement interactif avec maintien rapide -->
        <div class="adjust-panel" id="adjust-panel">
            <p id="step-instruction" style="margin:0 0 5px 0; font-size:0.85rem; color:#fff;">Touchez l'image pour placer, ou maintenez les flèches pour déplacer.</p>
            <div class="adjust-grid">
                <div></div>
                <button onmousedown="startMove(0, -12)" onmouseup="stopMove()" ontouchstart="startMove(0, -12)" ontouchend="stopMove()">⬆️</button>
                <div></div>
                
                <button onmousedown="startMove(-12, 0)" onmouseup="stopMove()" ontouchstart="startMove(-12, 0)" ontouchend="stopMove()">⬅️</button>
                <button onclick="resetCurrentPos()" style="background:#444;">🎯</button>
                <button onmousedown="startMove(12, 0)" onmouseup="stopMove()" ontouchstart="startMove(12, 0)" ontouchend="stopMove()">➡️</button>
                
                <div></div>
                <button onmousedown="startMove(0, 12)" onmouseup="stopMove()" ontouchstart="startMove(0, 12)" ontouchend="stopMove()">⬇️</button>
                <div></div>
            </div>
            <button class="btn" id="btn-validate-step" style="background: #17a2b8; margin-top: 10px;" onclick="validateStep()">Valider cette position</button>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image définitive (AcuTx)</a>
        <button id="btn-retry" class="btn" style="background: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');
        const stepInstruction = document.getElementById('step-instruction');

        let currentImg = null;
        let step = 0; // 0: Prêt, 1: Carré GAUCHE, 2: Carré DROIT, 3: Terminé

        let box1 = { x: 0, y: 0, size: 0 };
        let box2 = { x: 0, y: 0, size: 0 };
        let tempX = 0;
        let tempY = 0;
        let moveInterval = null;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;

                    step = 1;
                    let w = img.naturalWidth;
                    let h = img.naturalHeight;
                    
                    let defaultSize = w * 0.055; 
                    box1.size = defaultSize;
                    box2.size = defaultSize;

                    // Position initiale au centre
                    tempX = w * 0.4;
                    tempY = h * 0.4;

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    btnShoot.style.display = 'none';
                    
                    statusText.innerText = "Étape 1 / 2 : Carré GAUCHE";
                    stepInstruction.innerText = "Touchez l'image pour placer le carré gauche.";

                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Gestion tactile et clic direct sur l'image pour repositionner instantanément
        function handleCanvasTouch(clientX, clientY) {
            if (step !== 1 && step !== 2) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / canvas.clientWidth;
            const scaleY = canvas.height / canvas.clientHeight;
            
            tempX = (clientX - rect.left) * scaleX;
            tempY = (clientY - rect.top) * scaleY;
            redrawCanvas();
        }

        canvas.addEventListener('click', function(e) {
            handleCanvasTouch(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', function(e) {
            if (e.touches.length > 0) {
                handleCanvasTouch(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        }, { passive: false });

        // Système de déplacement en continu (maintien de la flèche)
        window.startMove = function(dx, dy) {
            stopMove();
            moveStep(dx, dy); // Premier pas immédiat
            moveInterval = setInterval(() => {
                moveStep(dx, dy);
            }, 60); // Répétition fluide toutes les 60ms
        }

        window.stopMove = function() {
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
        }

        function moveStep(dx, dy) {
            tempX += dx;
            tempY += dy;
            redrawCanvas();
        }

        function redrawCanvas() {
            if (!currentImg) return;

            ctx.drawImage(currentImg, 0, 0);

            let w = currentImg.naturalWidth;
            ctx.lineWidth = Math.max(6, w / 250);

            if (step === 1) {
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([w / 70, w / 90]);
                ctx.strokeRect(tempX - box1.size/2, tempY - box1.size/2, box1.size, box1.size);

            } else if (step === 2) {
                // Carré gauche validé (fixe)
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([]);
                ctx.strokeRect(box1.x - box1.size/2, box1.y - box1.size/2, box1.size, box1.size);

                // Carré droit en cours (pointillé)
                ctx.setLineDash([w / 70, w / 90]);
                ctx.strokeRect(tempX - box2.size/2, tempY - box2.size/2, box2.size, box2.size);

            } else if (step >= 3) {
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([]);
                ctx.strokeRect(box1.x - box1.size/2, box1.y - box1.size/2, box1.size, box1.size);
                ctx.strokeRect(box2.x - box2.size/2, box2.y - box2.size/2, box2.size, box2.size);

                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    btnDownload.href = url;
                    btnDownload.download = 'acuitix_etalon_acutx.jpg';
                }, 'image/jpeg', 0.98);
            }
        }

        window.resetCurrentPos = function() {
            tempX = currentImg.naturalWidth * 0.5;
            tempY = currentImg.naturalHeight * 0.4;
            redrawCanvas();
        }

        window.validateStep = function() {
            stopMove();
            if (step === 1) {
                box1.x = tempX;
                box1.y = tempY;

                step = 2;
                // Pré-positionne le carré droit un peu plus à droite
                tempX = box1.x + (currentImg.naturalWidth * 0.2); 
                tempY = box1.y;

                statusText.innerText = "Étape 2 / 2 : Carré DROIT";
                stepInstruction.innerText = "Touchez l'image pour placer le carré droit.";
                redrawCanvas();

            } else if (step === 2) {
                box2.x = tempX;
                box2.y = tempY;

                step = 3;
                adjustPanel.style.display = 'none';
                statusText.innerText = "✅ Calage terminé ! Prêt pour AcuTx.";
                btnDownload.style.display = 'block';
                btnRetry.style.display = 'block';
                redrawCanvas();
            }
        }

        btnRetry.addEventListener('click', function() {
            stopMove();
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            btnShoot.style.display = 'block';
            fileInput.value = '';
            currentImg = null;
            step = 0;
            statusText.innerText = "1. Prenez la photo globale de la plaque.";
        });
    </script>
</body>
</html>
