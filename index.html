<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Calage Manuel Séquentiel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 1.1rem; margin-bottom: 10px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 10px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 600px;
            position: relative;
        }
        canvas {
            width: 100%;
            max-height: 40vh;
            object-fit: contain;
            display: none;
        }
        #status-text { font-size: 0.95rem; color: #ffc107; margin-bottom: 10px; font-weight: bold; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 8px;
        }
        #file-input { display: none; }
        
        /* Panneau de contrôle directionnel */
        .adjust-panel {
            display: none;
            background: #333;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 180px;
            margin: 8px auto;
        }
        .adjust-grid button {
            padding: 10px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .adjust-grid button:active { background: #007bff; }
    </style>
</head>
<body>

    <h1>Acuitix - Calage Séquentiel</h1>

    <div class="box">
        <p id="status-text">1. Prenez la photo globale de la plaque.</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <!-- Panneau d'ajustement interactif -->
        <div class="adjust-panel" id="adjust-panel">
            <p id="step-instruction" style="margin:0 0 5px 0; font-size:0.85rem; color:#fff;">Utilisez les flèches pour positionner le carré.</p>
            <div class="adjust-grid">
                <div></div><button onclick="moveY(-5)">⬆️</button><div></div>
                <button onclick="moveX(-5)">⬅️</button><button onclick="resetCurrentPos()">🎯</button><button onclick="moveX(5)">➡️</button>
                <div></div><button onclick="moveY(5)">⬇️</button><div></div>
            </div>
            <button class="btn" id="btn-validate-step" style="background: #17a2b8; margin-top: 10px;" onclick="validateStep()">Valider cette position</button>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image définitive (AcuTx)</a>
        <button id="btn-retry" class="btn" style="background: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');
        const stepInstruction = document.getElementById('step-instruction');

        let currentImg = null;
        let step = 0; // 0: Prêt, 1: Calage Carré Gauche, 2: Calage Carré Droit, 3: Terminé

        // Coordonnées finales validées pour chaque carré
        let box1 = { x: 0, y: 0, size: 0 };
        let box2 = { x: 0, y: 0, size: 0 };

        // Position temporaire en cours de réglage
        let tempX = 0;
        let tempY = 0;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;

                    // Initialisation de l'étape 1 (Carré gauche)
                    step = 1;
                    let w = img.naturalWidth;
                    let h = img.naturalHeight;
                    
                    // Taille basée sur le ratio 10x10mm par rapport à la photo
                    let defaultSize = w * 0.055; 

                    // Position de départ approchée pour le carré de gauche (près du carré rouge gauche vu sur vos photos)
                    box1.size = defaultSize;
                    box1.x = w * 0.25;
                    box1.y = h * 0.45;

                    // Position de départ pour le carré de droite (basée sur l'entraxe)
                    box2.size = defaultSize;
                    box2.x = w * 0.65;
                    box2.y = h * 0.45;

                    tempX = box1.x;
                    tempY = box1.y;

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    btnShoot.style.display = 'none';
                    
                    statusText.innerText = "Étape 2 / 3 : Calage du Carré GAUCHE";
                    stepInstruction.innerText = "Ajustez le carré VERT sur le repère ROUGE de gauche.";

                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function redrawCanvas() {
            if (!currentImg) return;

            // Dessine l'image de fond brute
            ctx.drawImage(currentImg, 0, 0);

            let w = currentImg.naturalWidth;
            ctx.lineWidth = Math.max(6, w / 250);

            if (step === 1) {
                // On affiche le carré gauche en cours de réglage (vert vif clignotant/pointillé)
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([w / 70, w / 90]);
                ctx.strokeRect(tempX - box1.size/2, tempY - box1.size/2, box1.size, box1.size);

            } else if (step === 2) {
                // Le carré gauche est verrouillé (en vert continu fixe)
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([]);
                ctx.strokeRect(box1.x - box1.size/2, box1.y - box1.size/2, box1.size, box1.size);

                // Le carré droit est en cours de réglage (en vert pointillé)
                ctx.setLineDash([w / 70, w / 90]);
                ctx.strokeRect(tempX - box2.size/2, tempY - box2.size/2, box2.size, box2.size);

            } else if (step >= 3) {
                // Les deux carrés sont verrouillés et gravés définitivement
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([]);
                ctx.strokeRect(box1.x - box1.size/2, box1.y - box1.size/2, box1.size, box1.size);
                ctx.strokeRect(box2.x - box2.size/2, box2.y - box2.size/2, box2.size, box2.size);

                // Génération du blob pour téléchargement
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    btnDownload.href = url;
                    btnDownload.download = 'acuitix_etalon_prepa_acutx.jpg';
                }, 'image/jpeg', 0.98);
            }
        }

        window.moveX = function(val) { tempX += val; redrawCanvas(); }
        window.moveY = function(val) { tempY += val; redrawCanvas(); }
        window.resetCurrentPos = function() {
            if (step === 1) { tempX = box1.x; tempY = box1.y; }
            else if (step === 2) { tempX = box2.x; tempY = box2.y; }
            redrawCanvas();
        }

        window.validateStep = function() {
            if (step === 1) {
                // Enregistre la position du carré gauche
                box1.x = tempX;
                box1.y = tempY;

                // Passe à l'étape 2 (Carré droit)
                step = 2;
                tempX = box2.x;
                tempY = box2.y;

                statusText.innerText = "Étape 3 / 3 : Calage du Carré DROIT";
                stepInstruction.innerText = "Ajustez le carré VERT sur le repère ROUGE de droite.";
                redrawCanvas();

            } else if (step === 2) {
                // Enregistre la position du carré droit
                box2.x = tempX;
                box2.y = tempY;

                // Terminé !
                step = 3;
                adjustPanel.style.display = 'none';
                statusText.innerText = "✅ Calage terminé ! Prêt pour AcuTx.";
                btnDownload.style.display = 'block';
                btnRetry.style.display = 'block';
                redrawCanvas();
            }
        }

        btnRetry.addEventListener('click', function() {
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            btnShoot.style.display = 'block';
            fileInput.value = '';
            currentImg = null;
            step = 0;
            statusText.innerText = "1. Prenez la photo globale de la plaque.";
        });
    </script>
</body>
</html>
