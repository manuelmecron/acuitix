<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix.18 - Studio de Calage Expert</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 10px;
            text-align: center;
            user-select: none;
        }
        h1 { font-size: 1.05rem; margin-bottom: 8px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 8px;
            border-radius: 8px;
            margin: 8px auto;
            max-width: 600px;
            position: relative;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            max-height: 48vh;
            object-fit: contain;
            display: none;
            cursor: pointer;
            touch-action: manipulation;
        }
        #status-text { font-size: 0.9rem; color: #ffc107; margin-bottom: 6px; font-weight: bold; }
        .btn {
            display: block;
            width: 100%;
            padding: 11px;
            background: #28a745;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 6px;
        }
        .btn-secondary { background: #6c757d; }
        .btn-danger { background: #dc3545; }
        .btn-info { background: #17a2b8; }
        .btn-warning { background: #ffc107; color: #000; }
        #file-input { display: none; }
        
        .adjust-panel {
            display: none;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .sub-info { font-size: 0.8rem; color: #bbb; margin-bottom: 8px; }

        /* Panneau de déplacement de l'image (au-dessus pour clarté) */
        .camera-pan-container {
            background: #262626;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 10px;
        }
        .camera-pan-title {
            font-size: 0.78rem;
            color: #17a2b8;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .camera-pan-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .camera-pan-grid button {
            padding: 8px 4px;
            background: #495057;
            color: white;
            border: 1px solid #6c757d;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .camera-pan-grid button:active { background: #007bff; }

        /* Style Game Boy : 2 colonnes (D-Pad de la cible à gauche, Boutons à droite) */
        .gameboy-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        /* Croix directionnelle de la CIBLE (à gauche) */
        .dpad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #222;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #444;
            flex-shrink: 0;
            margin: auto 0;
        }
        .dpad-label {
            font-size: 0.72rem;
            color: #00FF00;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .dpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 42px);
            grid-template-rows: repeat(3, 42px);
            gap: 3px;
        }
        .dpad-grid button {
            background: #444;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        .dpad-grid button:active { background: #007bff; }

        /* Colonne de droite : lignes de réglages bien classées */
        .controls-right {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }
        .control-row {
            display: flex;
            gap: 5px;
        }
        .control-row button {
            flex: 1;
            padding: 9px 4px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.82rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .control-row button:active { background: #007bff; }
        .btn-action-blue { background: #007bff !important; }

        /* Bouton Centrer isolé */
        .center-row {
            margin-top: 4px;
            display: flex;
        }
        .center-row button {
            width: 100%;
            padding: 8px;
            background: #3a3a3a;
            border: 1px dashed #777;
            color: #ddd;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .center-row button:active { background: #555; }

        .nav-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Acuitix.18 - Studio de Calage Expert</h1>

    <div class="box">
        <p id="status-text">1. Prenez la photo du gabarit.</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <button class="btn btn-warning" id="btn-rotate-img" style="display:none; margin-top:6px;" onclick="rotateImage90()">🔄 Pivoter la photo (90°)</button>

        <div class="adjust-panel" id="adjust-panel">
            <p id="step-instruction" class="sub-info">Touchez pour poser, flèches gauche pour la cible, commandes ci-dessous pour l'image.</p>
            
            <!-- Bloc dédié au déplacement de l'image (Panoramique de la caméra) -->
            <div class="camera-pan-container">
                <div class="camera-pan-title">📷 Déplacement de l'image (Panoramique)</div>
                <div class="camera-pan-grid">
                    <button onmousedown="startAction(() => panCamera(0, 30), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => panCamera(0, 30), 50)" ontouchend="stopAction()">⬆️ Haut</button>
                    <button onmousedown="startAction(() => panCamera(30, 0), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => panCamera(30, 0), 50)" ontouchend="stopAction()">⬅️ Gauche</button>
                    <button onmousedown="startAction(() => panCamera(-30, 0), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => panCamera(-30, 0), 50)" ontouchend="stopAction()">➡️ Droite</button>
                    <button onmousedown="startAction(() => panCamera(0, -30), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => panCamera(0, -30), 50)" ontouchend="stopAction()">⬇️ Bas</button>
                </div>
            </div>

            <!-- Interface style Game Boy -->
            <div class="gameboy-container">
                <!-- Croix directionnelle CIBLE à gauche -->
                <div class="dpad-container" title="Déplacer la cible précisément">
                    <div class="dpad-label">Cible</div>
                    <div class="dpad-grid">
                        <div></div>
                        <button onmousedown="startAction(() => moveTarget(0, -6), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveTarget(0, -6), 40)" ontouchend="stopAction()">⬆️</button>
                        <div></div>
                        <button onmousedown="startAction(() => moveTarget(-6, 0), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveTarget(-6, 0), 40)" ontouchend="stopAction()">⬅️</button>
                        <div style="background:#2a2a2a; border-radius:4px;" title="Centre"></div>
                        <button onmousedown="startAction(() => moveTarget(6, 0), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveTarget(6, 0), 40)" ontouchend="stopAction()">➡️</button>
                        <div></div>
                        <button onmousedown="startAction(() => moveTarget(0, 6), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveTarget(0, 6), 40)" ontouchend="stopAction()">⬇️</button>
                        <div></div>
                    </div>
                </div>

                <!-- Commandes classées par lignes à droite -->
                <div class="controls-right" id="panel-tools">
                    <!-- Ligne 1 : Zoom d'affichage -->
                    <div class="control-row">
                        <button onclick="adjustZoom(0.5)">🔍+ Zoom</button>
                        <button onclick="adjustZoom(-0.5)">🔍- Zoom</button>
                    </div>
                    <!-- Ligne 2 : Échelle / Calibrage du motif -->
                    <div class="control-row">
                        <button class="btn-action-blue" onmousedown="startAction(() => adjustSize(2), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustSize(2), 50)" ontouchend="stopAction()">➕ Échelle</button>
                        <button class="btn-action-blue" onmousedown="startAction(() => adjustSize(-2), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustSize(-2), 50)" ontouchend="stopAction()">➖ Échelle</button>
                    </div>
                    <!-- Ligne 3 : Inclinaison / Rotation -->
                    <div class="control-row">
                        <button onmousedown="startAction(() => adjustAngle(-0.5), 70)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustAngle(-0.5), 70)" ontouchend="stopAction()">↺ -0.5°</button>
                        <button onmousedown="startAction(() => adjustAngle(0.5), 70)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustAngle(0.5), 70)" ontouchend="stopAction()">↻ +0.5°</button>
                    </div>
                    <!-- Bouton Centrer isolé en bas à droite -->
                    <div class="center-row">
                        <button onclick="resetCurrentPos()" title="Remettre au centre">🎯 Centrer la cible</button>
                    </div>
                </div>
            </div>

            <div id="hole-action-panel" style="display:none; margin-bottom: 8px;">
                <button class="btn" style="background: #28a745; margin-top:0;" onclick="askAddHole()">✅ Ajouter ce perçage</button>
                <button class="btn btn-danger" style="margin-top:6px;" onclick="removeLastHole()">⌫ Supprimer le dernier perçage</button>
            </div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" id="btn-prev-step" onclick="prevStep()" style="margin-top:0;">⬅️ Retour</button>
                <button class="btn btn-info" id="btn-validate-step" style="margin-top:0;" onclick="askValidateStep()">Valider l'étape</button>
            </div>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image définitive (AcuTx.18)</a>
        <button id="btn-retry" class="btn btn-danger" style="display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnRotateImg = document.getElementById('btn-rotate-img');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');
        const stepInstruction = document.getElementById('step-instruction');
        const panelTools = document.getElementById('panel-tools');
        const holeActionPanel = document.getElementById('hole-action-panel');

        let currentImg = null;
        let step = 0; 
        let rotationAngle = 0; 

        let box1 = { x: 0, y: 0, size: 0, angle: 0 };
        let box2 = { x: 0, y: 0, size: 0, angle: 0 };
        
        let corners = [
            { x: 0, y: 0, size: 0, angle: 0 }, 
            { x: 0, y: 0, size: 0, angle: 0 }, 
            { x: 0, y: 0, size: 0, angle: 0 }, 
            { x: 0, y: 0, size: 0, angle: 0 }  
        ];

        let holes = []; 

        let tempX = 0, tempY = 0, tempAngle = 0, tempSize = 0;
        let zoomLevel = 1.0;
        let manualPanX = 0; 
        let manualPanY = 0;
        let actionInterval = null;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    rotationAngle = 0;
                    updateCanvasDimensions();

                    step = 1;
                    zoomLevel = 1.0;
                    manualPanX = 0;
                    manualPanY = 0;
                    let w = canvas.width;
                    let h = canvas.height;
                    
                    let defaultSize = w * 0.055; 
                    box1.size = defaultSize;
                    box2.size = defaultSize;

                    for(let i=0; i<4; i++) {
                        corners[i].size = w * 0.06;
                    }

                    tempX = w * 0.5;
                    tempY = h * 0.5;
                    tempAngle = 0;
                    tempSize = defaultSize;

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    btnShoot.style.display = 'none';
                    btnRotateImg.style.display = 'block';
                    
                    updateUIState();
                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function updateCanvasDimensions() {
            if (!currentImg) return;
            if (rotationAngle === 90 || rotationAngle === 270) {
                canvas.width = currentImg.naturalHeight;
                canvas.height = currentImg.naturalWidth;
            } else {
                canvas.width = currentImg.naturalWidth;
                canvas.height = currentImg.naturalHeight;
            }
        }

        window.rotateImage90 = function() {
            if (!currentImg) return;
            rotationAngle = (rotationAngle + 90) % 360;
            updateCanvasDimensions();
            tempX = canvas.width * 0.5;
            tempY = canvas.height * 0.5;
            zoomLevel = 1.0;
            manualPanX = 0;
            manualPanY = 0;
            redrawCanvas();
        }

        window.startAction = function(actionFn, speedMs) {
            stopAction();
            actionFn();
            actionInterval = setInterval(actionFn, speedMs);
        }
        window.stopAction = function() { 
            if (actionInterval) { 
                clearInterval(actionInterval); 
                actionInterval = null; 
            } 
        }

        window.moveTarget = function(dx, dy) { tempX += dx; tempY += dy; redrawCanvas(); }
        window.panCamera = function(dx, dy) { manualPanX += dx; manualPanY += dy; redrawCanvas(); }
        
        window.adjustZoom = function(delta) {
            zoomLevel = Math.max(1.0, Math.min(5.0, zoomLevel + delta));
            if (zoomLevel === 1.0) {
                manualPanX = 0;
                manualPanY = 0;
            }
            redrawCanvas();
        }

        window.adjustAngle = function(deltaDeg) { if (step <= 6) { tempAngle += deltaDeg; redrawCanvas(); } }
        window.adjustSize = function(deltaSize) { tempSize = Math.max(10, tempSize + deltaSize); redrawCanvas(); }

        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientClickX = (e.clientX - rect.left) * scaleX;
            let clientClickY = (e.clientY - rect.top) * scaleY;

            let imgX, imgY;
            if (zoomLevel > 1.0) {
                imgX = (clientClickX - rect.width / 2 * scaleX) / zoomLevel + tempX - manualPanX;
                imgY = (clientClickY - rect.height / 2 * scaleY) / zoomLevel + tempY - manualPanY;
            } else {
                imgX = clientClickX;
                imgY = clientClickY;
            }

            if (step >= 1 && step <= 7) {
                tempX = imgX;
                tempY = imgY;
                redrawCanvas();
            }
        });

        window.askAddHole = function() {
            if (step === 7) {
                if (confirm("Confirmez-vous l'ajout de ce perçage à cet emplacement ?")) {
                    holes.push({ x: tempX, y: tempY, radius: box1.size * 0.25 });
                    tempX = canvas.width * 0.5;
                    tempY = canvas.height * 0.5;
                    manualPanX = 0;
                    manualPanY = 0;
                    zoomLevel = 1.0;
                    redrawCanvas();
                }
            }
        }

        window.removeLastHole = function() {
            if (step === 7 && holes.length > 0) {
                if (confirm("Voulez-vous supprimer le dernier perçage ajouté ?")) {
                    holes.pop();
                    redrawCanvas();
                }
            }
        }

        function redrawCanvas(isForExport = false) {
            if (!currentImg) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            if (!isForExport && zoomLevel > 1.0) {
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(zoomLevel, zoomLevel);
                ctx.translate(-tempX + manualPanX, -tempY + manualPanY);
            }

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((rotationAngle * Math.PI) / 180);
            if (rotationAngle === 90 || rotationAngle === 270) {
                ctx.drawImage(currentImg, -currentImg.naturalHeight / 2, -currentImg.naturalWidth / 2);
            } else {
                ctx.drawImage(currentImg, -currentImg.naturalWidth / 2, -currentImg.naturalHeight / 2);
            }
            ctx.restore();

            let refW = (rotationAngle === 90 || rotationAngle === 270) ? currentImg.naturalHeight : currentImg.naturalWidth;
            ctx.lineWidth = Math.max(4, refW / 300);

            // Carré GAUCHE
            if (step >= 2 || step === 1) {
                drawRotatedRect(step === 1 ? tempX : box1.x, step === 1 ? tempY : box1.y, step === 1 ? tempSize : box1.size, step === 1 ? tempAngle : box1.angle, (step === 1 && !isForExport), "#00FF00");
            }
            // Carré DROIT
            if (step >= 3 || step === 2) {
                drawRotatedRect(step === 2 ? tempX : box2.x, step === 2 ? tempY : box2.y, step === 2 ? tempSize : box2.size, step === 2 ? tempAngle : box2.angle, (step === 2 && !isForExport), "#00FF00");
            }

            // 4 Coins
            for (let i = 0; i < 4; i++) {
                let isActive = (step === i + 3 && !isForExport);
                let isPassed = (step > i + 3 || isForExport);
                if (isPassed || isActive) {
                    let cx = (step === i + 3 && !isForExport) ? tempX : corners[i].x;
                    let cy = (step === i + 3 && !isForExport) ? tempY : corners[i].y;
                    let csize = (step === i + 3 && !isForExport) ? tempSize : corners[i].size;
                    let cangle = (step === i + 3 && !isForExport) ? tempAngle : corners[i].angle;

                    drawCornerMarker(cx, cy, csize, cangle, isActive, "#007BFF", i);
                }
            }

            // Diagonales
            if (step >= 7) {
                ctx.save();
                ctx.strokeStyle = "#007BFF";
                ctx.lineWidth = Math.max(3, refW / 350);
                ctx.setLineDash([]);

                ctx.beginPath();
                ctx.moveTo(corners[0].x, corners[0].y);
                ctx.lineTo(corners[2].x, corners[2].y);
                ctx.moveTo(corners[1].x, corners[1].y);
                ctx.lineTo(corners[3].x, corners[3].y);
                ctx.stroke();
                ctx.restore();

                if (!isForExport && step === 7) {
                    ctx.save();
                    ctx.strokeStyle = "#00FFFF";
                    ctx.fillStyle = "rgba(0, 255, 255, 0.35)";
                    ctx.lineWidth = Math.max(3, refW / 400);
                    ctx.beginPath();
                    ctx.arc(tempX, tempY, box1.size * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Perçages validés
            holes.forEach(h => {
                ctx.save();
                ctx.strokeStyle = isForExport ? "#00FF00" : "#00FFFF";
                ctx.fillStyle = isForExport ? "rgba(0, 255, 0, 0.3)" : "rgba(0, 255, 255, 0.3)";
                ctx.lineWidth = Math.max(3, refW / 400);
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            ctx.restore();

            if (step === 8 && isForExport) {
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    btnDownload.href = url;
                    btnDownload.download = 'acuitix_etalon_expert_v18.jpg';
                }, 'image/jpeg', 0.98);
            }
        }

        function drawRotatedRect(x, y, size, angleDeg, isActive, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((angleDeg * Math.PI) / 180);
            ctx.strokeStyle = color;
            if (isActive) {
                ctx.setLineDash([canvas.width / 70, canvas.width / 90]);
            } else {
                ctx.setLineDash([]);
            }
            ctx.strokeRect(-size / 2, -size / 2, size, size);
            ctx.restore();
        }

        function drawCornerMarker(x, y, size, angleDeg, isActive, color, cornerIdx) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((angleDeg * Math.PI) / 180);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            
            if (isActive) {
                ctx.setLineDash([canvas.width / 80, canvas.width / 100]);
            } else {
                ctx.setLineDash([]);
            }

            ctx.lineWidth = Math.max(4, canvas.width / 250);

            let dirX = (cornerIdx === 1 || cornerIdx === 2) ? -1 : 1;
            let dirY = (cornerIdx === 2 || cornerIdx === 3) ? -1 : 1;

            ctx.beginPath();
            ctx.moveTo(dirX * size, 0);
            ctx.lineTo(0, 0);
            ctx.lineTo(0, dirY * size);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, 0, size * 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        window.resetCurrentPos = function() {
            manualPanX = 0;
            manualPanY = 0;
            if (step === 1) { tempX = box1.x; tempY = box1.y; }
            else if (step === 2) { tempX = box2.x; tempY = box2.y; }
            else if (step >= 3 && step <= 6) {
                let idx = step - 3;
                tempX = corners[idx].x; tempY = corners[idx].y;
            } else if (step === 7) {
                tempX = canvas.width * 0.5; tempY = canvas.height * 0.5;
            }
            redrawCanvas();
        }

        window.askValidateStep = function() {
            stopAction();
            let stepNames = ["", "Carré Gauche", "Carré Droit", "Coin Haut-Gauche", "Coin Haut-Droit", "Coin Bas-Droit", "Coin Bas-Gauche", "Perçages"];
            let label = stepNames[step] || "cette étape";
            
            if (step === 7 && holes.length === 0) {
                if (!confirm("Aucun perçage n'a été ajouté. Voulez-vous vraiment terminer sans perçage ?")) return;
            }

            if (confirm("Confirmez-vous la validation pour : " + label + " ?")) {
                validateStep();
            }
        }

        function validateStep() {
            manualPanX = 0;
            manualPanY = 0;

            if (step === 1) {
                box1.x = tempX; box1.y = tempY; box1.angle = tempAngle; box1.size = tempSize;
                step = 2;
                tempX = box1.x + (canvas.width * 0.15); 
                tempY = box1.y;
                tempAngle = box1.angle;
                tempSize = box1.size;
            } else if (step === 2) {
                box2.x = tempX; box2.y = tempY; box2.angle = tempAngle; box2.size = tempSize;
                step = 3; 
                tempX = Math.min(box1.x, box2.x) - (canvas.width * 0.08);
                tempY = Math.min(box1.y, box2.y) - (canvas.height * 0.08);
                tempAngle = 0;
                tempSize = box1.size * 1.2;
            } else if (step === 3) {
                corners[0].x = tempX; corners[0].y = tempY; corners[0].angle = tempAngle; corners[0].size = tempSize;
                step = 4;
                tempX = Math.max(box1.x, box2.x) + (canvas.width * 0.08);
                tempY = Math.min(box1.y, box2.y) - (canvas.height * 0.08);
            } else if (step === 4) {
                corners[1].x = tempX; corners[1].y = tempY; corners[1].angle = tempAngle; corners[1].size = tempSize;
                step = 5;
                tempX = Math.max(box1.x, box2.x) + (canvas.width * 0.08);
                tempY = Math.max(box1.y, box2.y) + (canvas.height * 0.08);
            } else if (step === 5) {
                corners[2].x = tempX; corners[2].y = tempY; corners[2].angle = tempAngle; corners[2].size = tempSize;
                step = 6;
                tempX = Math.min(box1.x, box2.x) - (canvas.width * 0.08);
                tempY = Math.max(box1.y, box2.y) + (canvas.height * 0.08);
            } else if (step === 6) {
                corners[3].x = tempX; corners[3].y = tempY; corners[3].angle = tempAngle; corners[3].size = tempSize;
                step = 7; 
                tempX = canvas.width * 0.5;
                tempY = canvas.height * 0.5;
            } else if (step === 7) {
                step = 8; 
                adjustPanel.style.display = 'none';
                btnRotateImg.style.display = 'none';
                statusText.innerText = "✅ Calage expert terminé (v.18) ! Prêt pour AcuTx.";
                btnDownload.style.display = 'block';
                btnRetry.style.display = 'block';
                zoomLevel = 1.0;
                redrawCanvas(true);
                return;
            }
            zoomLevel = 1.0;
            updateUIState();
            redrawCanvas();
        }

        window.prevStep = function() {
            stopAction();
            manualPanX = 0;
            manualPanY = 0;
            if (step > 1) {
                step--;
                if (step === 1) { tempX = box1.x; tempY = box1.y; tempAngle = box1.angle; tempSize = box1.size; }
                else if (step === 2) { tempX = box2.x; tempY = box2.y; tempAngle = box2.angle; tempSize = box2.size; }
                else if (step >= 3 && step <= 6) {
                    let idx = step - 3;
                    tempX = corners[idx].x; tempY = corners[idx].y; tempAngle = corners[idx].angle; tempSize = corners[idx].size;
                } else if (step === 7) {
                    tempX = corners[3].x; tempY = corners[3].y; tempAngle = corners[3].angle; tempSize = corners[3].size;
                }
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            }
        }

        function updateUIState() {
            let btnVal = document.getElementById('btn-validate-step');
            let btnPrev = document.getElementById('btn-prev-step');
            
            btnPrev.style.display = (step > 1) ? 'block' : 'none';

            if (step === 7) {
                holeActionPanel.style.display = 'block';
                btnVal.innerText = "Terminer et Générer";
                stepInstruction.innerText = "Touchez pour placer un perçage, ou utilisez les flèches.";
            } else {
                holeActionPanel.style.display = 'none';
                btnVal.innerText = "Valider l'étape";
            }

            if (step === 1) {
                statusText.innerText = "Étape 1 / 6 : Carré GAUCHE (Vert)";
            } else if (step === 2) {
                statusText.innerText = "Étape 2 / 6 : Carré DROIT (Vert)";
            } else if (step === 3) {
                statusText.innerText = "Étape 3 / 6 : Coin 1 / 4 (Haut-Gauche)";
            } else if (step === 4) {
                statusText.innerText = "Étape 4 / 6 : Coin 2 / 4 (Haut-Droit)";
            } else if (step === 5) {
                statusText.innerText = "Étape 5 / 6 : Coin 3 / 4 (Bas-Droit)";
            } else if (step === 6) {
                statusText.innerText = "Étape 6 / 6 : Coin 4 / 4 (Bas-Gauche)";
            }
        }

        btnRetry.addEventListener('click', function() {
            stopAction();
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            btnRotateImg.style.display = 'none';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            btnShoot.style.display = 'block';
            holeActionPanel.style.display = 'none';
            fileInput.value = '';
            currentImg = null;
            holes = [];
            step = 0;
            rotationAngle = 0;
            zoomLevel = 1.0;
            manualPanX = 0;
            manualPanY = 0;
            statusText.innerText = "1. Prenez la photo du gabarit.";
        });
    </script>
</body>
</html>
