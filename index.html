<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Module Étalon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { font-size: 1.2rem; margin-bottom: 10px; text-align: center; }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 50vh;
            min-height: 300px;
            border: 2px solid #555;
            border-radius: 8px;
            overflow: hidden;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas, img-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Repères virtuels permanents avant la photo */
        .guide-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10% 15%;
            box-sizing: border-box;
        }
        .guide-square {
            width: 30%;
            height: 60%;
            border: 3px dashed #00ff00;
            box-sizing: border-box;
        }

        #placeholder-text {
            position: absolute;
            bottom: 10px;
            color: #aaa;
            font-size: 0.8rem;
            text-align: center;
            width: 100%;
            background: rgba(0,0,0,0.6);
            padding: 5px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            gap: 10px;
        }
        .btn-action {
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .btn-action:hover { background-color: #218838; }
        #file-input { display: none; }
        
        #instructions {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Acuitix - Étalon Métrologique</h1>
    
    <div class="container" id="view-container">
        <!-- Canvas qui affichera la photo finale -->
        <canvas id="photo-canvas" style="display: none;"></canvas>
        
        <!-- Guide visuel avant capture -->
        <div class="guide-overlay" id="guide-overlay">
            <div class="guide-square"></div>
            <div class="guide-square"></div>
        </div>
        <div id="placeholder-text">Mode Paysage conseillé • Alignez votre plaque sur les repères</div>
    </div>

    <div class="controls">
        <label for="file-input" class="btn-action">📸 Prendre la photo (Caméra)</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">
        
        <button id="download-btn" class="btn-action" style="background-color: #007bff; display: none;">💾 Télécharger l'image avec l'étalon</button>
        <button id="share-btn" class="btn-action" style="background-color: #ffc107; color: #000; display: none;">📤 Partager / Envoyer la photo</button>
        <button id="retake-btn" class="btn-action" style="background-color: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <div id="instructions">
        <b>Protocole :</b> Prenez la photo, l'étalon sera gravé automatiquement en haute résolution.
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');
        const guideOverlay = document.getElementById('guide-overlay');
        const placeholderText = document.getElementById('placeholder-text');
        const downloadBtn = document.getElementById('download-btn');
        const shareBtn = document.getElementById('share-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const instructions = document.getElementById('instructions');

        let finalImageBlob = null;

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;

                        // 1. Dessine l'image brute
                        ctx.drawImage(img, 0, 0);

                        // 2. Grave les carrés verts de façon rigoureuse sur les pixels
                        ctx.strokeStyle = "#00ff00";
                        ctx.lineWidth = Math.max(12, img.naturalWidth / 180);
                        ctx.setLineDash([img.naturalWidth / 50, img.naturalWidth / 80]);

                        let w = img.naturalWidth;
                        let h = img.naturalHeight;
                        
                        // Même position proportionnelle que le guide visuel
                        ctx.strokeRect(w * 0.17, h * 0.20, w * 0.28, h * 0.60);
                        ctx.strokeRect(w * 0.55, h * 0.20, w * 0.28, h * 0.60);

                        // Bascule l'affichage
                        canvas.style.display = 'block';
                        guideOverlay.style.display = 'none';
                        placeholderText.style.display = 'none';

                        fileInput.parentElement.style.display = 'none';
                        downloadBtn.style.display = 'block';
                        retakeBtn.style.display = 'block';
                        if (navigator.share) {
                            shareBtn.style.display = 'block';
                        }

                        canvas.toBlob(function(blob) {
                            finalImageBlob = blob;
                            const blobUrl = URL.createObjectURL(blob);

                            downloadBtn.onclick = function() {
                                const a = document.createElement('a');
                                a.href = blobUrl;
                                a.download = 'acuitix_etalon_controle.jpg';
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                            };
                        }, 'image/jpeg', 0.98);

                        instructions.innerHTML = "<b>✅ Capture validée !</b><br>L'étalon métrologique est incrusté sur l'image.";
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        retakeBtn.addEventListener('click', function() {
            canvas.style.display = 'none';
            guideOverlay.style.display = 'flex';
            placeholderText.style.display = 'block';
            fileInput.parentElement.style.display = 'block';
            downloadBtn.style.display = 'none';
            shareBtn.style.display = 'none';
            retakeBtn.style.display = 'none';
            fileInput.value = '';
            instructions.innerHTML = "<b>Protocole :</b> Prenez la photo, l'étalon sera gravé automatiquement en haute résolution.";
        });

        shareBtn.addEventListener('click', async () => {
            if (finalImageBlob) {
                const fileObj = new File([finalImageBlob], 'acuitix_etalon_controle.jpg', { type: 'image/jpeg' });
                if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
                    try {
                        await navigator.share({
                            files: [fileObj],
                            title: 'Contrôle Acuitix',
                            text: 'Photo avec étalon de contrôle intégré.'
                        });
                    } catch (error) {
                        console.log('Partage annulé', error);
                    }
                }
            }
        });
    </script>
</body>
</html>
