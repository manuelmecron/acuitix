<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Studio de Calage Expert</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 10px;
            text-align: center;
            user-select: none;
        }
        h1 { font-size: 1.05rem; margin-bottom: 8px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 8px;
            border-radius: 8px;
            margin: 8px auto;
            max-width: 600px;
            position: relative;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            max-height: 38vh;
            object-fit: contain;
            display: none;
            cursor: crosshair;
            touch-action: none;
        }
        #status-text { font-size: 0.9rem; color: #ffc107; margin-bottom: 8px; font-weight: bold; }
        .btn {
            display: block;
            width: 100%;
            padding: 11px;
            background: #28a745;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 6px;
        }
        #file-input { display: none; }
        
        .adjust-panel {
            display: none;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 160px;
            margin: 0 auto;
        }
        .adjust-grid button, .controls-row button {
            padding: 9px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .adjust-grid button:active, .controls-row button:active { background: #007bff; }
        .sub-info { font-size: 0.8rem; color: #bbb; margin-bottom: 6px; }
    </style>
</head>
<body>

    <h1>Acuitix - Studio de Calage Expert</h1>

    <div class="box">
        <p id="status-text">1. Prenez la photo globale de la plaque.</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <div class="adjust-panel" id="adjust-panel">
            <p id="step-instruction" class="sub-info">Maintenez les boutons appuyés pour ajuster en continu.</p>
            
            <!-- Contrôles Zoom, Rotation et Taille avec appui continu -->
            <div class="controls-row" id="panel-tools">
                <button onclick="adjustZoom(0.2)">🔍+</button>
                <button onclick="adjustZoom(-0.2)">🔍-</button>
                <button onmousedown="startAction(() => adjustAngle(-0.5), 70)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustAngle(-0.5), 70)" ontouchend="stopAction()">↺ -0.5°</button>
                <button onmousedown="startAction(() => adjustAngle(0.5), 70)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustAngle(0.5), 70)" ontouchend="stopAction()">↻ +0.5°</button>
                <button onmousedown="startAction(() => adjustSize(2), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustSize(2), 50)" ontouchend="stopAction()" id="btn-size-up" style="background:#007bff;">➕ Taille</button>
                <button onmousedown="startAction(() => adjustSize(-2), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustSize(-2), 50)" ontouchend="stopAction()" id="btn-size-down" style="background:#007bff;">➖ Taille</button>
            </div>

            <!-- Grille de déplacement continu -->
            <div class="adjust-grid">
                <div></div>
                <button onmousedown="startAction(() => moveStep(0, -6), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(0, -6), 40)" ontouchend="stopAction()">⬆️</button>
                <div></div>
                
                <button onmousedown="startAction(() => moveStep(-6, 0), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(-6, 0), 40)" ontouchend="stopAction()">⬅️</button>
                <button onclick="resetCurrentPos()" style="background:#444;" title="Centrer">🎯</button>
                <button onmousedown="startAction(() => moveStep(6, 0), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(6, 0), 40)" ontouchend="stopAction()">➡️</button>
                
                <div></div>
                <button onmousedown="startAction(() => moveStep(0, 6), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(0, 6), 40)" ontouchend="stopAction()">⬇️</button>
                <div></div>
            </div>

            <button class="btn" id="btn-validate-step" style="background: #17a2b8; margin-top: 10px;" onclick="validateStep()">Valider & Étape Suivante</button>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image définitive (AcuTx)</a>
        <button id="btn-retry" class="btn" style="background: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');
        const stepInstruction = document.getElementById('step-instruction');
        const panelTools = document.getElementById('panel-tools');

        let currentImg = null;
        let step = 0; 

        let box1 = { x: 0, y: 0, size: 0, angle: 0 };
        let box2 = { x: 0, y: 0, size: 0, angle: 0 };
        let template = { x: 0, y: 0, width: 0, height: 0, angle: 0 }; // Gabarit 170x100 avec diagonales
        let holes = []; 

        let tempX = 0, tempY = 0, tempAngle = 0, tempSize = 0, tempW = 0, tempH = 0;
        let zoomLevel = 1.0;
        let actionInterval = null;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;

                    step = 1;
                    zoomLevel = 1.0;
                    let w = img.naturalWidth;
                    let h = img.naturalHeight;
                    
                    let defaultSize = w * 0.055; 
                    box1.size = defaultSize;
                    box2.size = defaultSize;

                    template.width = w * 0.7;
                    template.height = template.width * (100 / 170);

                    tempX = w * 0.4;
                    tempY = h * 0.4;
                    tempAngle = 0;
                    tempSize = defaultSize;

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    btnShoot.style.display = 'none';
                    
                    updateUIState();
                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function handleCanvasTouch(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / canvas.clientWidth;
            const scaleY = canvas.height / canvas.clientHeight;
            
            let clickX = (clientX - rect.left) * scaleX;
            let clickY = (clientY - rect.top) * scaleY;

            if (step === 1 || step === 2 || step === 3) {
                tempX = clickX;
                tempY = clickY;
            } else if (step === 4) {
                holes.push({ x: clickX, y: clickY, radius: box1.size * 0.25 });
            }
            redrawCanvas();
        }

        canvas.addEventListener('click', function(e) { handleCanvasTouch(e.clientX, e.clientY); });
        canvas.addEventListener('touchstart', function(e) {
            if (e.touches.length > 0) {
                handleCanvasTouch(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        }, { passive: false });

        // Maintien continu universel
        window.startAction = function(actionFn, speedMs) {
            stopAction();
            actionFn();
            actionInterval = setInterval(actionFn, speedMs);
        }
        window.stopAction = function() { 
            if (actionInterval) { 
                clearInterval(actionInterval); 
                actionInterval = null; 
            } 
        }

        window.moveStep = function(dx, dy) { tempX += dx; tempY += dy; redrawCanvas(); }
        window.adjustZoom = function(delta) { zoomLevel = Math.max(1.0, Math.min(4.0, zoomLevel + delta)); redrawCanvas(); }
        window.adjustAngle = function(deltaDeg) { if (step <= 3) { tempAngle += deltaDeg; redrawCanvas(); } }
        
        window.adjustSize = function(deltaSize) {
            if (step === 1 || step === 2) {
                tempSize = Math.max(10, tempSize + deltaSize);
                redrawCanvas();
            } else if (step === 3) {
                tempW = Math.max(50, tempW + (deltaSize * 4));
                tempH = Math.max(30, tempH + (deltaSize * 2.5));
                redrawCanvas();
            }
        }

        function redrawCanvas() {
            if (!currentImg) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (zoomLevel > 1.0) {
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(zoomLevel, zoomLevel);
                ctx.translate(-tempX, -tempY);
            }

            ctx.drawImage(currentImg, 0, 0);

            let w = currentImg.naturalWidth;
            ctx.lineWidth = Math.max(4, w / 300);

            // 1. Carré GAUCHE (Vert)
            if (step >= 2 || step === 1) {
                drawRotatedRect(step === 1 ? tempX : box1.x, step === 1 ? tempY : box1.y, step === 1 ? tempSize : box1.size, step === 1 ? tempAngle : box1.angle, step === 1, "#00FF00");
            }
            // 2. Carré DROIT (Vert)
            if (step >= 3 || step === 2) {
                drawRotatedRect(step === 2 ? tempX : box2.x, step === 2 ? tempY : box2.y, step === 2 ? tempSize : box2.size, step === 2 ? tempAngle : box2.angle, step === 2, "#00FF00");
            }
            // 3. Gabarit 170x100 (BLEU avec 4 coins et 2 diagonales croisées)
            if (step >= 4 || step === 3) {
                let rx = step === 3 ? tempX : template.x;
                let ry = step === 3 ? tempY : template.y;
                let rw = step === 3 ? tempW : template.width;
                let rh = step === 3 ? tempH : template.height;
                let ra = step === 3 ? tempAngle : template.angle;

                ctx.save();
                ctx.translate(rx, ry);
                ctx.rotate((ra * Math.PI) / 180);
                ctx.strokeStyle = "#007BFF"; // BLEU
                if (step === 3) {
                    ctx.setLineDash([w / 70, w / 90]);
                } else {
                    ctx.setLineDash([]);
                }
                
                // Tracé du rectangle 170x100
                ctx.strokeRect(-rw / 2, -rh / 2, rw, rh);

                // Tracé des deux diagonales pour le contrôle croisé
                ctx.beginPath();
                ctx.moveTo(-rw / 2, -rh / 2);
                ctx.lineTo(rw / 2, rh / 2);
                ctx.moveTo(rw / 2, -rh / 2);
                ctx.lineTo(-rw / 2, rh / 2);
                ctx.stroke();

                ctx.restore();
            }

            // 4. Perçages multiples (Verts)
            ctx.fillStyle = "#00FF00";
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = Math.max(3, w / 400);
            holes.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            ctx.restore();

            if (step === 5) {
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    btnDownload.href = url;
                    btnDownload.download = 'acuitix_etalon_expert.jpg';
                }, 'image/jpeg', 0.98);
            }
        }

        function drawRotatedRect(x, y, size, angleDeg, isActive, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((angleDeg * Math.PI) / 180);
            ctx.strokeStyle = color;
            if (isActive) {
                ctx.setLineDash([currentImg.naturalWidth / 70, currentImg.naturalWidth / 90]);
            } else {
                ctx.setLineDash([]);
            }
            ctx.strokeRect(-size / 2, -size / 2, size, size);
            ctx.restore();
        }

        window.resetCurrentPos = function() {
            tempX = currentImg.naturalWidth * 0.5;
            tempY = currentImg.naturalHeight * 0.4;
            tempAngle = 0;
            redrawCanvas();
        }

        window.validateStep = function() {
            stopAction();
            if (step === 1) {
                box1.x = tempX; box1.y = tempY; box1.angle = tempAngle; box1.size = tempSize;
                step = 2;
                tempX = box1.x + (currentImg.naturalWidth * 0.2); 
                tempY = box1.y;
                tempAngle = box1.angle;
                tempSize = box1.size;
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            } else if (step === 2) {
                box2.x = tempX; box2.y = tempY; box2.angle = tempAngle; box2.size = tempSize;
                step = 3; // Gabarit 170x100 + Diagonales (Bleu)
                tempX = currentImg.naturalWidth * 0.5;
                tempY = currentImg.naturalHeight * 0.5;
                tempW = template.width;
                tempH = template.height;
                tempAngle = 0;
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            } else if (step === 3) {
                template.x = tempX; template.y = tempY; template.width = tempW; template.height = tempH; template.angle = tempAngle;
                step = 4; // Perçages (Verts)
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            } else if (step === 4) {
                step = 5; // Terminé
                adjustPanel.style.display = 'none';
                statusText.innerText = "✅ Calage expert terminé ! Prêt pour AcuTx.";
                btnDownload.style.display = 'block';
                btnRetry.style.display = 'block';
                redrawCanvas();
            }
        }

        function updateUIState() {
            if (step === 1) {
                statusText.innerText = "Étape 1 / 4 : Carré GAUCHE (Vert)";
                stepInstruction.innerText = "Maintenez les flèches ou la taille pour ajuster rapidement.";
            } else if (step === 2) {
                statusText.innerText = "Étape 2 / 4 : Carré DROIT (Vert)";
                stepInstruction.innerText = "Maintenez les flèches ou la taille pour ajuster rapidement.";
            } else if (step === 3) {
                statusText.innerText = "Étape 3 / 4 : Gabarit 170x100 + Diagonales (Bleu)";
                stepInstruction.innerText = "Ajustez les 4 coins et l'angle pour aligner les diagonales.";
                document.getElementById('btn-size-up').innerText = "➕ Grand.";
                document.getElementById('btn-size-down').innerText = "➖ Grand.";
            } else if (step === 4) {
                statusText.innerText = "Étape 4 / 4 : Perçages Multiples (Verts)";
                stepInstruction.innerText = "Touchez l'écran pour poser les cercles de perçage.";
                panelTools.style.display = 'none';
                document.getElementById('btn-validate-step').innerText = "Terminer et Générer l'image";
            }
        }

        btnRetry.addEventListener('click', function() {
            stopAction();
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            btnShoot.style.display = 'block';
            panelTools.style.display = 'flex';
            fileInput.value = '';
            currentImg = null;
            holes = [];
            step = 0;
            statusText.innerText = "1. Prenez la photo globale de la plaque.";
        });
    </script>
</body>
</html>
