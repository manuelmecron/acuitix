<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Étalon Réglable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 1.1rem; margin-bottom: 10px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 10px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 600px;
            position: relative;
        }
        canvas {
            width: 100%;
            max-height: 40vh;
            object-fit: contain;
            display: none;
        }
        #status-text { font-size: 0.9rem; color: #ccc; margin-bottom: 10px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 8px;
        }
        #file-input { display: none; }
        
        /* Commandes pour bouger les carrés à la main */
        .adjust-panel {
            display: none;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 200px;
            margin: 5px auto;
        }
        .adjust-grid button {
            padding: 10px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .adjust-grid button:active { background: #007bff; }
    </style>
</head>
<body>

    <h1>Acuitix - Calage de l'Étalon</h1>

    <div class="box">
        <p id="status-text">Prenez la photo avec votre appareil.</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <!-- Panneau pour ajuster la position des carrés si besoin -->
        <div class="adjust-panel" id="adjust-panel">
            <p style="margin:0 0 5px 0; font-size:0.85rem; color:#ffc107;">Ajuster la position des carrés :</p>
            <div class="adjust-grid">
                <div></div><button onclick="moveY(-10)">⬆️</button><div></div>
                <button onclick="moveX(-10)">⬅️</button><button onclick="resetPos()">🎯</button><button onclick="moveX(10)">➡️</button>
                <div></div><button onclick="moveY(10)">⬇️</button><div></div>
            </div>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image définitive</a>
        <button id="btn-retry" class="btn" style="background: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');

        let currentImg = null;
        // Décalages modifiables par les boutons
        let offsetX = 0;
        let offsetY = 0;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    offsetX = 0;
                    offsetY = 0;
                    redrawImage();

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    statusText.innerText = "Ajustez les carrés avec les flèches si nécessaire.";
                    btnShoot.style.display = 'none';
                    btnDownload.style.display = 'block';
                    btnRetry.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function redrawImage() {
            if (!currentImg) return;
            
            canvas.width = currentImg.naturalWidth;
            canvas.height = currentImg.naturalHeight;

            // 1. Redessine la photo propre
            ctx.drawImage(currentImg, 0, 0);

            // 2. Dessine les carrés (taille beaucoup plus petite et réaliste, ex: 6% de large au lieu de 25%)
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = Math.max(6, currentImg.naturalWidth / 300);
            ctx.setLineDash([currentImg.naturalWidth / 80, currentImg.naturalWidth / 100]);

            let w = currentImg.naturalWidth;
            let h = currentImg.naturalHeight;
            
            // Taille d'un carré : 7% de largeur, 15% de hauteur (adapté à vos petits carrés rouges)
            let boxW = w * 0.07;
            let boxH = h * 0.15;

            // Positions de base + décalages manuels
            let leftX = w * 0.32 + offsetX;
            let leftY = h * 0.42 + offsetY;
            
            let rightX = w * 0.61 + offsetX;
            let rightY = h * 0.42 + offsetY;

            ctx.strokeRect(leftX, leftY, boxW, boxH);
            ctx.strokeRect(rightX, rightY, boxW, boxH);

            // Mise à jour du lien de téléchargement en temps réel
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                btnDownload.href = url;
                btnDownload.download = 'acuitix_etalon_ajuste.jpg';
            }, 'image/jpeg', 0.95);
        }

        window.moveX = function(val) { offsetX += val; redrawImage(); }
        window.moveY = function(val) { offsetY += val; redrawImage(); }
        window.resetPos = function() { offsetX = 0; offsetY = 0; redrawImage(); }

        btnRetry.addEventListener('click', function() {
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            statusText.innerText = "Prenez la photo avec votre appareil.";
            btnShoot.style.display = 'block';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            fileInput.value = '';
            currentImg = null;
        });
    </script>
</body>
</html>
