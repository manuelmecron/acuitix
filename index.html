<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Photo automatique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 1.1rem; margin-bottom: 10px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 10px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 600px;
            position: relative;
        }
        canvas {
            width: 100%;
            max-height: 40vh;
            object-fit: contain;
            display: none;
        }
        #status-text { font-size: 0.9rem; color: #ccc; margin-bottom: 10px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 8px;
        }
        #file-input { display: none; }
        
        /* Panneau de réglage fin des carrés */
        .adjust-panel {
            display: none;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 180px;
            margin: 5px auto;
        }
        .adjust-grid button {
            padding: 8px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .adjust-grid button:active { background: #007bff; }
    </style>
</head>
<body>

    <h1>Acuitix - Photo automatique</h1>

    <div class="box">
        <p id="status-text">Prenez la photo globale de la plaque.</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo automatique</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <!-- Commandes d'ajustement fin manuel -->
        <div class="adjust-panel" id="adjust-panel">
            <p style="margin:0 0 5px 0; font-size:0.8rem; color:#ffc107;">Ajustement fin (10x10 mm - Entraxe 100 mm) :</p>
            <div class="adjust-grid">
                <div></div><button onclick="moveY(-5)">⬆️</button><div></div>
                <button onclick="moveX(-5)">⬅️</button><button onclick="resetPos()">🎯</button><button onclick="moveX(5)">➡️</button>
                <div></div><button onclick="moveY(5)">⬇️</button><div></div>
            </div>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image avec l'étalon</a>
        <button id="btn-retry" class="btn" style="background: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');

        let currentImg = null;
        let offsetX = 0;
        let offsetY = 0;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    offsetX = 0;
                    offsetY = 0;
                    redrawImage();

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    statusText.innerText = "✅ Photo acquise ! Ajustez si besoin avec les flèches.";
                    btnShoot.style.display = 'none';
                    btnDownload.style.display = 'block';
                    btnRetry.style.display = 'block';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function redrawImage() {
            if (!currentImg) return;
            
            canvas.width = currentImg.naturalWidth;
            canvas.height = currentImg.naturalHeight;

            // 1. Redessine la photo brute
            ctx.drawImage(currentImg, 0, 0);

            // 2. Calcul des proportions basé sur l'entraxe DXF (100mm de centre à centre, carrés de 10mm)
            // Sur une photo de format standard, on définit l'écartement des carrés proportionnellement à la largeur de l'image
            let w = currentImg.naturalWidth;
            let h = currentImg.naturalHeight;

            // Taille d'un carré fixée proportionnellement à la résolution pour correspondre au gabarit réel de 10x10mm
            // (ajusté pour coller pile-poil à vos carrés rouges témoins vus sur la photo précédente)
            let boxSize = w * 0.055; 

            // Positionnement des deux carrés avec l'entraxe (séparés par ~15% à 20% de la largeur selon le cadrage) + décalages manuels
            let centerX1 = w * 0.42 + offsetX;
            let centerY1 = h * 0.32 + offsetY;

            let centerX2 = w * 0.58 + offsetX; // Espace proportionnel respectant l'entraxe de référence
            let centerY2 = h * 0.32 + offsetY;

            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = Math.max(6, w / 250);
            ctx.setLineDash([w / 70, w / 90]);

            // Dessin centré sur les coordonnées
            ctx.strokeRect(centerX1 - boxSize/2, centerY1 - boxSize/2, boxSize, boxSize);
            ctx.strokeRect(centerX2 - boxSize/2, centerY2 - boxSize/2, boxSize, boxSize);

            // Mise à jour du téléchargement
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                btnDownload.href = url;
                btnDownload.download = 'acuitix_etalon_automatique.jpg';
            }, 'image/jpeg', 0.95);
        }

        window.moveX = function(val) { offsetX += val; redrawImage(); }
        window.moveY = function(val) { offsetY += val; redrawImage(); }
        window.resetPos = function() { offsetX = 0; offsetY = 0; redrawImage(); }

        btnRetry.addEventListener('click', function() {
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            statusText.innerText = "Prenez la photo globale de la plaque.";
            btnShoot.style.display = 'block';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            fileInput.value = '';
            currentImg = null;
        });
    </script>
</body>
</html>
