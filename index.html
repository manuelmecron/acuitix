<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Capture Étalon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.3rem; margin-bottom: 15px; text-align: center; }
        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 55vh;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        #placeholder {
            color: #888;
            text-align: center;
            padding: 20px;
            font-size: 0.95rem;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            gap: 12px;
        }
        .btn-action {
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .btn-action:hover { background-color: #218838; }
        #file-input { display: none; }
        
        #instructions {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Acuitix - Module Étalon</h1>
    
    <div class="container">
        <div id="placeholder">Aucune photo pour l'instant.<br>Cliquez sur le bouton ci-dessous.</div>
        <img id="photo-preview" alt="Aperçu de la capture">
    </div>

    <div class="controls">
        <!-- Déclencheur natif de l'appareil photo -->
        <label for="file-input" class="btn-action">📸 Ouvrir la caméra & Capturer</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">
        
        <!-- Bouton de téléchargement direct forcé dans les fichiers/téléchargements -->
        <a id="download-btn" class="btn-action" style="background-color: #007bff; display: none;" download="acuitix_capture.jpg">💾 Enregistrer l'image sur le téléphone</a>
        
        <!-- Bouton de partage natif (si supporté par le téléphone) -->
        <button id="share-btn" class="btn-action" style="background-color: #ffc107; color: #000; display: none;">📤 Partager / Envoyer l'image</button>
    </div>

    <div id="instructions">
        <b>1.</b> Prenez la photo via la caméra.<br>
        <b>2.</b> Utilisez le bouton bleu pour enregistrer l'image dans vos fichiers/téléchargements.<br>
        <b>3.</b> Retouchez ou partagez-la si besoin.
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const photoPreview = document.getElementById('photo-preview');
        const placeholder = document.getElementById('placeholder');
        const downloadBtn = document.getElementById('download-btn');
        const shareBtn = document.getElementById('share-btn');
        const instructions = document.getElementById('instructions');

        let currentFile = null;

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                currentFile = file;
                const imageURL = URL.createObjectURL(file);
                
                // Affichage de l'aperçu
                photoPreview.src = imageURL;
                photoPreview.style.display = 'block';
                placeholder.style.display = 'none';

                // Activation du bouton de téléchargement direct
                downloadBtn.href = imageURL;
                downloadBtn.style.display = 'block';

                // Activation du bouton de partage natif si disponible
                if (navigator.share && navigator.canShare) {
                    shareBtn.style.display = 'block';
                }

                instructions.innerHTML = "<b>✅ Photo prête !</b><br>Cliquez sur le bouton bleu pour l'enregistrer sur votre téléphone.";
            }
        });

        // Gestion du partage natif (WhatsApp, Messenger, etc.)
        shareBtn.addEventListener('click', async () => {
            if (currentFile && navigator.share) {
                try {
                    await navigator.share({
                        files: [currentFile],
                        title: 'Capture Acuitix',
                        text: 'Voici la photo de capture étalon Acuitix.'
                    });
                } catch (error) {
                    console.log('Partage annulé ou non pris en charge', error);
                }
            }
        });
    </script>
</body>
</html>
