<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix V.107 - Assistant CAO Complet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 600px;
            margin: 0 auto;
        }
        .viewport-container {
            position: relative;
            flex: 1;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        canvas {
            z-index: 10;
            pointer-events: auto;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- En-tête & Barre de progression des 7 étapes -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 flex flex-col space-y-2">
        <div class="flex justify-between items-center">
            <h1 class="text-sm font-bold text-cyan-400">Acuitix V.107 CAO</h1>
            <div id="stepIndicator" class="text-xs font-semibold bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-800">
                Étape 1 / 7 : Standard Gauche (X)
            </div>
            <button id="colorDrawerBtn" class="text-xs bg-slate-800 border border-slate-700 px-2 py-1 rounded text-slate-300">
                Palette
            </button>
        </div>
        <!-- Barre d'outils secondaire : Zoom, Rotation, Caméra -->
        <div class="flex justify-between items-center text-xs gap-1">
            <button id="toggleCamBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-2.5 py-1 rounded font-semibold transition">
                Activer Caméra
            </button>
            <div class="flex gap-1">
                <button id="zoomInBtn" class="bg-slate-800 border border-slate-700 px-2 py-1 rounded">+</button>
                <button id="zoomOutBtn" class="bg-slate-800 border border-slate-700 px-2 py-1 rounded">-</button>
                <button id="rotateBtn" class="bg-slate-800 border border-slate-700 px-2 py-1 rounded">⟳ 90°</button>
                <button id="resetViewBtn" class="bg-slate-800 border border-slate-700 px-2 py-1 rounded">Reset</button>
            </div>
        </div>
    </header>

    <!-- Vue Principale : Flux Vidéo & Canvas Interactif -->
    <div class="viewport-container" id="viewport">
        <video id="videoElement" autoplay playsinline muted></video>
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- Tiroir de configuration / Standards & Palette (Masquable/Modulable) -->
    <div id="configPanel" class="bg-slate-900 border-t border-slate-800 p-3 space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-slate-400 mb-1">Standard Gauche (Axe X)</label>
                <select id="stdLeft" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-slate-200">
                    <option value="2e">Pièce 2€</option>
                    <option value="1e">Pièce 1€</option>
                    <option value="10mm">Carré 10x10 mm</option>
                    <option value="card">Carte de fidélité</option>
                </select>
            </div>
            <div>
                <label class="block text-slate-400 mb-1">Standard Droit (Axe Y)</label>
                <select id="stdRight" class="w-full bg-slate-950 border border-slate-700 rounded p-1.5 text-slate-200">
                    <option value="1e">Pièce 1€</option>
                    <option value="2e">Pièce 2€</option>
                    <option value="10mm">Carré 10x10 mm</option>
                    <option value="card">Carte de fidélité</option>
                </select>
            </div>
        </div>

        <div id="paletteContainer" class="hidden flex items-center justify-between bg-slate-950 p-2 rounded border border-slate-800">
            <span class="text-slate-400">Couleur du calque :</span>
            <div class="flex gap-2">
                <button class="w-5 h-5 rounded-full bg-cyan-400 border border-white color-picker" data-color="#22d3ee"></button>
                <button class="w-5 h-5 rounded-full bg-yellow-400 border border-transparent color-picker" data-color="#facc15"></button>
                <button class="w-5 h-5 rounded-full bg-fuchsia-500 border border-transparent color-picker" data-color="#d946ef"></button>
                <button class="w-5 h-5 rounded-full bg-white border border-transparent color-picker" data-color="#ffffff"></button>
            </div>
        </div>

        <!-- Navigation Workflow & Export -->
        <div class="flex gap-2 pt-1">
            <button id="prevStepBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded transition">
                Précédent
            </button>
            <button id="nextStepBtn" class="flex-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded transition">
                Suivant (Étape 2)
            </button>
        </div>
        <button id="captureBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded shadow-lg transition">
            Exporter le résultat (Acuitix_V107_Resultat.png)
        </button>
    </div>
</div>

<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const toggleCamBtn = document.getElementById('toggleCamBtn');
    const nextStepBtn = document.getElementById('nextStepBtn');
    const prevStepBtn = document.getElementById('prevStepBtn');
    const stepIndicator = document.getElementById('stepIndicator');
    const captureBtn = document.getElementById('captureBtn');
    const colorDrawerBtn = document.getElementById('colorDrawerBtn');
    const paletteContainer = document.getElementById('paletteContainer');
    const rotateBtn = document.getElementById('rotateBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const resetViewBtn = document.getElementById('resetViewBtn');

    let streamActive = false;
    let currentStep = 1;
    let overlayColor = '#22d3ee';
    let rotationAngle = 0;
    let zoomLevel = 1;
    let panX = 0;
    let panY = 0;

    // Gestion du flux caméra sous Chrome Mobile
    async function startCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: { ideal: 'environment' },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };
            const mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = mediaStream;
            streamActive = true;
            toggleCamBtn.textContent = "Arrêter Caméra";
            toggleCamBtn.classList.replace('bg-cyan-600', 'bg-rose-600');
            
            video.onloadedmetadata = () => {
                resizeCanvas();
                requestAnimationFrame(renderLoop);
            };
        } catch (error) {
            console.error("Erreur caméra :", error);
            alert("Impossible d'accéder à la caméra sous Chrome Mobile. Vérifiez les permissions.");
        }
    }

    function stopCamera() {
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
            video.srcObject = null;
            streamActive = false;
            toggleCamBtn.textContent = "Activer Caméra";
            toggleCamBtn.classList.replace('bg-rose-600', 'bg-cyan-600');
        }
    }

    toggleCamBtn.addEventListener('click', () => {
        if (streamActive) stopCamera();
        else startCamera();
    });

    function resizeCanvas() {
        canvas.width = video.videoWidth || window.innerWidth;
        canvas.height = video.videoHeight || window.innerHeight;
    }

    // Boucle de rendu principale (Flux Vidéo + Axes X Rouge & Y Vert obligatoires + Calques CAO)
    function renderLoop() {
        if (!streamActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        // Gestion Zoom, Pan, Rotation
        ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
        ctx.rotate((rotationAngle * Math.PI) / 180);
        ctx.scale(zoomLevel, zoomLevel);
        ctx.translate(-video.videoWidth / 2, -video.videoHeight / 2);

        // Dessin de la vidéo en arrière-plan
        ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);

        const vW = video.videoWidth;
        const vH = video.videoHeight;
        const cX = vW / 2;
        const cY = vH / 2;

        // --- AXE X : Tracé en ROUGE ---
        ctx.beginPath();
        ctx.strokeStyle = '#ef4444'; // Rouge vif
        ctx.lineWidth = 4 / zoomLevel;
        ctx.moveTo(0, cY);
        ctx.lineTo(vW, cY);
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.font = `bold ${Math.max(14, 20 / zoomLevel)}px sans-serif`;
        ctx.fillText('AXE X (Rouge)', vW - 140, cY - 10);

        // --- AXE Y : Tracé en VERT ---
        ctx.beginPath();
        ctx.strokeStyle = '#22c55e'; // Vert vif
        ctx.lineWidth = 4 / zoomLevel;
        ctx.moveTo(cX, 0);
        ctx.lineTo(cX, vH);
        ctx.stroke();

        ctx.fillStyle = '#22c55e';
        ctx.fillText('AXE Y (Vert)', cX + 15, 40);

        // Indicateur visuel selon l'étape courante (1 à 7)
        drawWorkflowGuides(vW, vH, cX, cY);

        ctx.restore();
        requestAnimationFrame(renderLoop);
    }

    function drawWorkflowGuides(w, h, cx, cy) {
        ctx.strokeStyle = overlayColor;
        ctx.lineWidth = 2;
        if (currentStep === 1) {
            // Repère standard gauche (X)
            ctx.strokeRect(cx - 150, cy - 50, 80, 80);
            ctx.fillText("Standard Gauche", cx - 150, cy - 60);
        } else if (currentStep === 2) {
            // Repère standard droit (Y)
            ctx.strokeRect(cx + 70, cy - 50, 80, 80);
            ctx.fillText("Standard Droit", cx + 70, cy - 60);
        } else if (currentStep >= 3 && currentStep <= 6) {
            // Coins (Top-Left, Top-Right, Bottom-Right, Bottom-Left)
            const offsets = [
                {x: cx - 200, y: cy - 150, label: "Coin Haut-Gauche"},
                {x: cx + 200, y: cy - 150, label: "Coin Haut-Droit"},
                {x: cx + 200, y: cy + 150, label: "Coin Bas-Droit"},
                {x: cx - 200, y: cy + 150, label: "Coin Bas-Gauche"}
            ];
            const pt = offsets[currentStep - 3];
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 15, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillText(pt.label, pt.x - 30, pt.y - 20);
        } else if (currentStep === 7) {
            // Emplacements de trous spécifiques
            ctx.beginPath();
            ctx.arc(cx, cy, 20, 0, Math.PI * 2);
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillText("Emplacement Trou (Optionnel)", cx - 60, cy - 25);
        }
    }

    // Gestion des étapes (1 à 7)
    const stepNames = [
        "Standard Gauche (X)",
        "Standard Droit (Y)",
        "Coin Haut-Gauche",
        "Coin Haut-Droit",
        "Coin Bas-Droit",
        "Coin Bas-Gauche",
        "Gestion des Trous"
    ];

    nextStepBtn.addEventListener('click', () => {
        if (currentStep < 7) {
            currentStep++;
            updateStepUI();
        }
    });

    prevStepBtn.addEventListener('click', () => {
        if (currentStep > 1) {
            currentStep--;
            updateStepUI();
        }
    });

    function updateStepUI() {
        stepIndicator.textContent = `Étape ${currentStep} / 7 : ${stepNames[currentStep - 1]}`;
        nextStepBtn.textContent = currentStep === 7 ? "Terminé" : `Suivant (Étape ${currentStep + 1})`;
    }

    // Gestion de la palette de couleurs
    colorDrawerBtn.addEventListener('click', () => {
        paletteContainer.classList.toggle('hidden');
    });

    document.querySelectorAll('.color-picker').forEach(btn => {
        btn.addEventListener('click', (e) => {
            overlayColor = e.target.getAttribute('data-color');
            document.querySelectorAll('.color-picker').forEach(b => b.classList.remove('border-white'));
            e.target.classList.add('border-white');
        });
    });

    // Contrôles de vue (Zoom, Rotation)
    rotateBtn.addEventListener('click', () => { rotationAngle = (rotationAngle + 90) % 360; });
    zoomInBtn.addEventListener('click', () => { zoomLevel = Math.min(zoomLevel + 0.25, 3); });
    zoomOutBtn.addEventListener('click', () => { zoomLevel = Math.max(zoomLevel - 0.25, 0.5); });
    resetViewBtn.addEventListener('click', () => { zoomLevel = 1; rotationAngle = 0; panX = 0; panY = 0; });

    // Exportation finale de l'image combinée flux + axes
    captureBtn.addEventListener('click', () => {
        if (!streamActive) {
            alert("Veuillez activer la caméra avant d'exporter.");
            return;
        }

        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = video.videoWidth;
        exportCanvas.height = video.videoHeight;
        const expCtx = exportCanvas.getContext('2d');

        expCtx.drawImage(video, 0, 0);
        // Superposition propre des axes X (Rouge) et Y (Vert) sur l'image exportée
        const cX = video.videoWidth / 2;
        const cY = video.videoHeight / 2;

        expCtx.beginPath();
        expCtx.strokeStyle = '#ef4444';
        expCtx.lineWidth = 4;
        expCtx.moveTo(0, cY);
        expCtx.lineTo(video.videoWidth, cY);
        expCtx.stroke();

        expCtx.beginPath();
        expCtx.strokeStyle = '#22c55e';
        expCtx.lineWidth = 4;
        expCtx.moveTo(cX, 0);
        expCtx.lineTo(cX, video.videoHeight);
        expCtx.stroke();

        const link = document.createElement('a');
        link.download = 'Acuitix_V107_Resultat.png';
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
    });
</script>
</body>
</html>
