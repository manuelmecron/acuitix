<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix.3 - Studio de Calage Expert</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 10px;
            text-align: center;
            user-select: none;
        }
        h1 { font-size: 1.05rem; margin-bottom: 8px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 8px;
            border-radius: 8px;
            margin: 8px auto;
            max-width: 600px;
            position: relative;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            max-height: 42vh;
            object-fit: contain;
            display: none;
            cursor: crosshair;
            touch-action: none;
        }
        #status-text { font-size: 0.9rem; color: #ffc107; margin-bottom: 8px; font-weight: bold; }
        .btn {
            display: block;
            width: 100%;
            padding: 11px;
            background: #28a745;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 6px;
        }
        #file-input { display: none; }
        
        .adjust-panel {
            display: none;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
        }
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            max-width: 160px;
            margin: 0 auto;
        }
        .adjust-grid button, .controls-row button {
            padding: 9px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .adjust-grid button:active, .controls-row button:active { background: #007bff; }
        .sub-info { font-size: 0.8rem; color: #bbb; margin-bottom: 6px; }
    </style>
</head>
<body>

    <h1>Acuitix.3 - Studio de Calage Expert</h1>

    <div class="box">
        <p id="status-text">1. Prenez la photo en mode PAYSAGE (16:9).</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo (16:9)</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <div class="adjust-panel" id="adjust-panel">
            <p id="step-instruction" class="sub-info">Maintenez les boutons appuyés pour ajuster en continu.</p>
            
            <!-- Contrôles Zoom, Rotation et Taille -->
            <div class="controls-row" id="panel-tools">
                <button onclick="adjustZoom(0.2)">🔍+</button>
                <button onclick="adjustZoom(-0.2)">🔍-</button>
                <button onmousedown="startAction(() => adjustAngle(-0.5), 70)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustAngle(-0.5), 70)" ontouchend="stopAction()">↺ -0.5°</button>
                <button onmousedown="startAction(() => adjustAngle(0.5), 70)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustAngle(0.5), 70)" ontouchend="stopAction()">↻ +0.5°</button>
                <button onmousedown="startAction(() => adjustSize(2), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustSize(2), 50)" ontouchend="stopAction()" id="btn-size-up" style="background:#007bff;">➕ Taille</button>
                <button onmousedown="startAction(() => adjustSize(-2), 50)" onmouseup="stopAction()" ontouchstart="startAction(() => adjustSize(-2), 50)" ontouchend="stopAction()" id="btn-size-down" style="background:#007bff;">➖ Taille</button>
            </div>

            <!-- Grille de déplacement continu -->
            <div class="adjust-grid">
                <div></div>
                <button onmousedown="startAction(() => moveStep(0, -6), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(0, -6), 40)" ontouchend="stopAction()">⬆️</button>
                <div></div>
                
                <button onmousedown="startAction(() => moveStep(-6, 0), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(-6, 0), 40)" ontouchend="stopAction()">⬅️</button>
                <button onclick="resetCurrentPos()" style="background:#444;" title="Centrer">🎯</button>
                <button onmousedown="startAction(() => moveStep(6, 0), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(6, 0), 40)" ontouchend="stopAction()">➡️</button>
                
                <div></div>
                <button onmousedown="startAction(() => moveStep(0, 6), 40)" onmouseup="stopAction()" ontouchstart="startAction(() => moveStep(0, 6), 40)" ontouchend="stopAction()">⬇️</button>
                <div></div>
            </div>

            <button class="btn" id="btn-validate-step" style="background: #17a2b8; margin-top: 10px;" onclick="validateStep()">Valider & Étape Suivante</button>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image définitive (AcuTx.3)</a>
        <button id="btn-retry" class="btn" style="background: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');
        const stepInstruction = document.getElementById('step-instruction');
        const panelTools = document.getElementById('panel-tools');

        let currentImg = null;
        let step = 0; 

        let box1 = { x: 0, y: 0, size: 0, angle: 0 };
        let box2 = { x: 0, y: 0, size: 0, angle: 0 };
        
        let corners = [
            { x: 0, y: 0, size: 0, angle: 0 }, // 0: Haut-Gauche
            { x: 0, y: 0, size: 0, angle: 0 }, // 1: Haut-Droit
            { x: 0, y: 0, size: 0, angle: 0 }, // 2: Bas-Droit
            { x: 0, y: 0, size: 0, angle: 0 }  // 3: Bas-Gauche
        ];

        let holes = []; 

        let tempX = 0, tempY = 0, tempAngle = 0, tempSize = 0;
        let zoomLevel = 1.0;
        let actionInterval = null;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    // Utilisation stricte des dimensions natives pour conserver le format 16:9 réel de la photo
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;

                    step = 1;
                    zoomLevel = 1.0;
                    let w = img.naturalWidth;
                    let h = img.naturalHeight;
                    
                    let defaultSize = w * 0.055; 
                    box1.size = defaultSize;
                    box2.size = defaultSize;

                    for(let i=0; i<4; i++) {
                        corners[i].size = w * 0.06;
                    }

                    tempX = w * 0.4;
                    tempY = h * 0.4;
                    tempAngle = 0;
                    tempSize = defaultSize;

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    btnShoot.style.display = 'none';
                    
                    updateUIState();
                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function handleCanvasTouch(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / canvas.clientWidth;
            const scaleY = canvas.height / canvas.clientHeight;
            
            let clickX = (clientX - rect.left) * scaleX;
            let clickY = (clientY - rect.top) * scaleY;

            if (step >= 1 && step <= 6) {
                tempX = clickX;
                tempY = clickY;
            } else if (step === 7) {
                holes.push({ x: clickX, y: clickY, radius: box1.size * 0.25 });
            }
            redrawCanvas();
        }

        canvas.addEventListener('click', function(e) { handleCanvasTouch(e.clientX, e.clientY); });
        canvas.addEventListener('touchstart', function(e) {
            if (e.touches.length > 0) {
                handleCanvasTouch(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        }, { passive: false });

        window.startAction = function(actionFn, speedMs) {
            stopAction();
            actionFn();
            actionInterval = setInterval(actionFn, speedMs);
        }
        window.stopAction = function() { 
            if (actionInterval) { 
                clearInterval(actionInterval); 
                actionInterval = null; 
            } 
        }

        window.moveStep = function(dx, dy) { tempX += dx; tempY += dy; redrawCanvas(); }
        window.adjustZoom = function(delta) { zoomLevel = Math.max(1.0, Math.min(4.0, zoomLevel + delta)); redrawCanvas(); }
        window.adjustAngle = function(deltaDeg) { if (step <= 6) { tempAngle += deltaDeg; redrawCanvas(); } }
        
        window.adjustSize = function(deltaSize) {
            tempSize = Math.max(10, tempSize + deltaSize);
            redrawCanvas();
        }

        function redrawCanvas() {
            if (!currentImg) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (zoomLevel > 1.0) {
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(zoomLevel, zoomLevel);
                ctx.translate(-tempX, -tempY);
            }

            ctx.drawImage(currentImg, 0, 0);

            let w = currentImg.naturalWidth;
            ctx.lineWidth = Math.max(4, w / 300);

            // 1. Carré GAUCHE (Vert)
            if (step >= 2 || step === 1) {
                drawRotatedRect(step === 1 ? tempX : box1.x, step === 1 ? tempY : box1.y, step === 1 ? tempSize : box1.size, step === 1 ? tempAngle : box1.angle, step === 1, "#00FF00");
            }
            // 2. Carré DROIT (Vert)
            if (step >= 3 || step === 2) {
                drawRotatedRect(step === 2 ? tempX : box2.x, step === 2 ? tempY : box2.y, step === 2 ? tempSize : box2.size, step === 2 ? tempAngle : box2.angle, step === 2, "#00FF00");
            }

            // 3 à 6. Les 4 coins indépendants avec orientation intérieure précise
            for (let i = 0; i < 4; i++) {
                let isActive = (step === i + 3);
                let isPassed = (step > i + 3);
                if (isPassed || isActive) {
                    let cx = isActive ? tempX : corners[i].x;
                    let cy = isActive ? tempY : corners[i].y;
                    let csize = isActive ? tempSize : corners[i].size;
                    let cangle = isActive ? tempAngle : corners[i].angle;

                    drawCornerMarker(cx, cy, csize, cangle, isActive, "#007BFF", i);
                }
            }

            // 7. Diagonales intérieures validées
            if (step >= 7) {
                ctx.save();
                ctx.strokeStyle = "#007BFF";
                ctx.lineWidth = Math.max(3, w / 350);
                ctx.setLineDash([]);

                // Diagonale 1 (Haut-Gauche vers Bas-Droit)
                ctx.beginPath();
                ctx.moveTo(corners[0].x, corners[0].y);
                ctx.lineTo(corners[2].x, corners[2].y);
                // Diagonale 2 (Haut-Droit vers Bas-Gauche)
                ctx.moveTo(corners[1].x, corners[1].y);
                ctx.lineTo(corners[3].x, corners[3].y);
                ctx.stroke();
                ctx.restore();
            }

            // 8. Perçages multiples (Verts)
            ctx.fillStyle = "#00FF00";
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = Math.max(3, w / 400);
            holes.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });

            ctx.restore();

            if (step === 8) {
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    btnDownload.href = url;
                    btnDownload.download = 'acuitix_etalon_expert_v3.jpg';
                }, 'image/jpeg', 0.98);
            }
        }

        function drawRotatedRect(x, y, size, angleDeg, isActive, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((angleDeg * Math.PI) / 180);
            ctx.strokeStyle = color;
            if (isActive) {
                ctx.setLineDash([currentImg.naturalWidth / 70, currentImg.naturalWidth / 90]);
            } else {
                ctx.setLineDash([]);
            }
            ctx.strokeRect(-size / 2, -size / 2, size, size);
            ctx.restore();
        }

        function drawCornerMarker(x, y, size, angleDeg, isActive, color, cornerIdx) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate((angleDeg * Math.PI) / 180);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            
            if (isActive) {
                ctx.setLineDash([currentImg.naturalWidth / 80, currentImg.naturalWidth / 100]);
            } else {
                ctx.setLineDash([]);
            }

            ctx.lineWidth = Math.max(4, currentImg.naturalWidth / 250);

            // CORRECTION DES 4 SYMBOLES INDÉPENDANTS (Ouverture vers l'intérieur)
            // 0 (Haut-Gauche) : s'ouvre vers la droite (+X) et le bas (+Y)
            // 1 (Haut-Droit)  : s'ouvre vers la gauche (-X) et le bas (+Y)
            // 2 (Bas-Droit)   : s'ouvre vers la gauche (-X) et le haut (-Y)
            // 3 (Bas-Gauche)  : s'ouvre vers la droite (+X) et le haut (-Y)
            let dirX = (cornerIdx === 1 || cornerIdx === 2) ? -1 : 1;
            let dirY = (cornerIdx === 2 || cornerIdx === 3) ? -1 : 1;

            // 1. L'angle droit (90°)
            ctx.beginPath();
            ctx.moveTo(dirX * size, 0);
            ctx.lineTo(0, 0);
            ctx.lineTo(0, dirY * size);
            ctx.stroke();

            // 2. Le trait central à 45° pointant vers l'intérieur
            ctx.beginPath();
            ctx.moveTo(0, 0);
            let diagLen = size * 0.7;
            ctx.lineTo(dirX * diagLen * 0.707, dirY * diagLen * 0.707);
            ctx.stroke();

            // 3. Le point central exact du sommet
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.12, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        window.resetCurrentPos = function() {
            tempX = currentImg.naturalWidth * 0.5;
            tempY = currentImg.naturalHeight * 0.4;
            tempAngle = 0;
            redrawCanvas();
        }

        window.validateStep = function() {
            stopAction();
            if (step === 1) {
                box1.x = tempX; box1.y = tempY; box1.angle = tempAngle; box1.size = tempSize;
                step = 2;
                tempX = box1.x + (currentImg.naturalWidth * 0.2); 
                tempY = box1.y;
                tempAngle = box1.angle;
                tempSize = box1.size;
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            } else if (step === 2) {
                box2.x = tempX; box2.y = tempY; box2.angle = tempAngle; box2.size = tempSize;
                step = 3; // Coin 1 (Haut-Gauche)
                tempX = currentImg.naturalWidth * 0.25;
                tempY = currentImg.naturalHeight * 0.25;
                tempAngle = 0;
                tempSize = box1.size * 1.2;
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            } else if (step >= 3 && step <= 5) {
                let cornerIdx = step - 3;
                corners[cornerIdx].x = tempX;
                corners[cornerIdx].y = tempY;
                corners[cornerIdx].angle = tempAngle;
                corners[cornerIdx].size = tempSize;

                step++; // Coin suivant
                if (step === 4) { tempX = currentImg.naturalWidth * 0.75; tempY = currentImg.naturalHeight * 0.25; }
                else if (step === 5) { tempX = currentImg.naturalWidth * 0.75; tempY = currentImg.naturalHeight * 0.75; }
                else if (step === 6) { tempX = currentImg.naturalWidth * 0.25; tempY = currentImg.naturalHeight * 0.75; }
                
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            } else if (step === 6) {
                corners[3].x = tempX; corners[3].y = tempY; corners[3].angle = tempAngle; corners[3].size = tempSize;
                step = 7; // Diagonales intérieures tracées + Perçages
                zoomLevel = 1.0;
                updateUIState();
                redrawCanvas();
            } else if (step === 7) {
                step = 8; // Terminé
                adjustPanel.style.display = 'none';
                statusText.innerText = "✅ Calage expert terminé (v.3) ! Prêt pour AcuTx.";
                btnDownload.style.display = 'block';
                btnRetry.style.display = 'block';
                redrawCanvas();
            }
        }

        function updateUIState() {
            if (step === 1) {
                statusText.innerText = "Étape 1 / 6 : Carré GAUCHE (Vert)";
                stepInstruction.innerText = "Ajustez position, taille et angle du carré gauche.";
            } else if (step === 2) {
                statusText.innerText = "Étape 2 / 6 : Carré DROIT (Vert)";
                stepInstruction.innerText = "Ajustez position, taille et angle du carré droit.";
            } else if (step === 3) {
                statusText.innerText = "Étape 3 / 6 : Coin 1 / 4 (Haut-Gauche)";
                stepInstruction.innerText = "Placez l'angle droit (ouverture vers l'intérieur) sur le coin Haut-Gauche.";
            } else if (step === 4) {
                statusText.innerText = "Étape 4 / 6 : Coin 2 / 4 (Haut-Droit)";
                stepInstruction.innerText = "Placez l'angle droit (ouverture vers l'intérieur) sur le coin Haut-Droit.";
            } else if (step === 5) {
                statusText.innerText = "Étape 5 / 6 : Coin 3 / 4 (Bas-Droit)";
                stepInstruction.innerText = "Placez l'angle droit (ouverture vers l'intérieur) sur le coin Bas-Droit.";
            } else if (step === 6) {
                statusText.innerText = "Étape 6 / 6 : Coin 4 / 4 (Bas-Gauche)";
                stepInstruction.innerText = "Placez l'angle droit (ouverture vers l'intérieur) sur le coin Bas-Gauche.";
            } else if (step === 7) {
                statusText.innerText = "Étape 7 : Diagonales intérieures & Perçages";
                stepInstruction.innerText = "Les diagonales s'entrecroisent à l'intérieur. Touchez l'écran pour poser les perçages.";
                panelTools.style.display = 'none';
                document.getElementById('btn-validate-step').innerText = "Terminer et Générer l'image";
            }
        }

        btnRetry.addEventListener('click', function() {
            stopAction();
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            btnShoot.style.display = 'block';
            panelTools.style.display = 'flex';
            fileInput.value = '';
            currentImg = null;
            holes = [];
            step = 0;
            statusText.innerText = "1. Prenez la photo en mode PAYSAGE (16:9).";
        });
    </script>
</body>
</html>
