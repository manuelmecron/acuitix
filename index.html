<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuitix - Calage Séquentiel Interactif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 1.1rem; margin-bottom: 10px; }
        .box {
            background: #2a2a2a;
            border: 2px solid #555;
            padding: 10px;
            border-radius: 8px;
            margin: 10px auto;
            max-width: 600px;
            position: relative;
        }
        canvas {
            width: 100%;
            max-height: 40vh;
            object-fit: contain;
            display: none;
            cursor: pointer;
        }
        #status-text { font-size: 0.95rem; color: #ffc107; margin-bottom: 10px; font-weight: bold; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            margin-top: 8px;
        }
        #file-input { display: none; }
        
        /* Panneau de contrôle directionnel */
        .adjust-panel {
            display: none;
            background: #333;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 180px;
            margin: 8px auto;
        }
        .adjust-grid button {
            padding: 10px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .adjust-grid button:active { background: #007bff; }
    </style>
</head>
<body>

    <h1>Acuitix - Calage Séquentiel</h1>

    <div class="box">
        <p id="status-text">1. Prenez la photo globale de la plaque.</p>
        <canvas id="canvas"></canvas>
    </div>

    <div>
        <label for="file-input" class="btn" id="btn-shoot">📸 Prendre la photo</label>
        <input type="file" id="file-input" accept="image/*" capture="environment">

        <!-- Panneau d'ajustement interactif -->
        <div class="adjust-panel" id="adjust-panel">
            <p id="step-instruction" style="margin:0 0 5px 0; font-size:0.85rem; color:#fff;">Touchez l'écran pour placer le carré, puis ajustez aux flèches.</p>
            <div class="adjust-grid">
                <div></div><button onclick="moveY(-5)">⬆️</button><div></div>
                <button onclick="moveX(-5)">⬅️</button><button onclick="resetCurrentPos()">🎯</button><button onclick="moveX(5)">➡️</button>
                <div></div><button onclick="moveY(5)">⬇️</button><div></div>
            </div>
            <button class="btn" id="btn-validate-step" style="background: #17a2b8; margin-top: 10px;" onclick="validateStep()">Valider cette position</button>
        </div>
        
        <a id="btn-download" class="btn" style="background: #007bff; display: none;">💾 Télécharger l'image définitive (AcuTx)</a>
        <button id="btn-retry" class="btn" style="background: #dc3545; display: none;">🔄 Recommencer</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const btnShoot = document.getElementById('btn-shoot');
        const btnDownload = document.getElementById('btn-download');
        const btnRetry = document.getElementById('btn-retry');
        const adjustPanel = document.getElementById('adjust-panel');
        const stepInstruction = document.getElementById('step-instruction');

        let currentImg = null;
        let step = 0; // 0: Prêt, 1: Carré GAUCHE, 2: Carré DROIT, 3: Terminé

        let box1 = { x: 0, y: 0, size: 0 };
        let box2 = { x: 0, y: 0, size: 0 };
        let tempX = 0;
        let tempY = 0;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;

                    step = 1;
                    let w = img.naturalWidth;
                    let h = img.naturalHeight;
                    
                    // Taille fixe du carré 10x10 mm proportionnelle à la résolution de l'image
                    let defaultSize = w * 0.055; 

                    box1.size = defaultSize;
                    box2.size = defaultSize;

                    // Position de départ par défaut au centre pour le premier carré
                    tempX = w * 0.4;
                    tempY = h * 0.4;

                    canvas.style.display = 'block';
                    adjustPanel.style.display = 'block';
                    btnShoot.style.display = 'none';
                    
                    statusText.innerText = "Étape 1 / 2 : Carré GAUCHE";
                    stepInstruction.innerText = "Touchez le repère rouge gauche sur l'image, puis affinez aux flèches.";

                    redrawCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Permet de positionner instantanément le carré en touchant/cliquant sur l'image
        canvas.addEventListener('click', function(e) {
            if (step !== 1 && step !== 2) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / canvas.clientWidth;
            const scaleY = canvas.height / canvas.clientHeight;
            
            tempX = (e.clientX - rect.left) * scaleX;
            tempY = (e.clientY - rect.top) * scaleY;
            redrawCanvas();
        });

        function redrawCanvas() {
            if (!currentImg) return;

            ctx.drawImage(currentImg, 0, 0);

            let w = currentImg.naturalWidth;
            ctx.lineWidth = Math.max(6, w / 250);

            if (step === 1) {
                // Affichage du carré gauche en cours de réglage (pointillé vert)
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([w / 70, w / 90]);
                ctx.strokeRect(tempX - box1.size/2, tempY - box1.size/2, box1.size, box1.size);

            } else if (step === 2) {
                // Carré gauche validé (vert fixe)
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([]);
                ctx.strokeRect(box1.x - box1.size/2, box1.y - box1.size/2, box1.size, box1.size);

                // Carré droit en cours de réglage (pointillé vert)
                ctx.setLineDash([w / 70, w / 90]);
                ctx.strokeRect(tempX - box2.size/2, tempY - box2.size/2, box2.size, box2.size);

            } else if (step >= 3) {
                // Les deux carrés validés et incrustés définitivement sur l'image
                ctx.strokeStyle = "#00ff00";
                ctx.setLineDash([]);
                ctx.strokeRect(box1.x - box1.size/2, box1.y - box1.size/2, box1.size, box1.size);
                ctx.strokeRect(box2.x - box2.size/2, box2.y - box2.size/2, box2.size, box2.size);

                // Exportation vers le fichier téléchargeable
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    btnDownload.href = url;
                    btnDownload.download = 'acuitix_etalon_acutx.jpg';
                }, 'image/jpeg', 0.98);
            }
        }

        window.moveX = function(val) { tempX += val; redrawCanvas(); }
        window.moveY = function(val) { tempY += val; redrawCanvas(); }
        window.resetCurrentPos = function() {
            tempX = currentImg.naturalWidth * 0.5;
            tempY = currentImg.naturalHeight * 0.4;
            redrawCanvas();
        }

        window.validateStep = function() {
            if (step === 1) {
                // Enregistre définitivement le carré de gauche
                box1.x = tempX;
                box1.y = tempY;

                // Passe au carré de droite (pré-positionné à côté)
                step = 2;
                tempX = box1.x + (currentImg.naturalWidth * 0.2); // Estimation de l'entraxe
                tempY = box1.y;

                statusText.innerText = "Étape 2 / 2 : Carré DROIT";
                stepInstruction.innerText = "Touchez le repère rouge droit sur l'image, puis affinez aux flèches.";
                redrawCanvas();

            } else if (step === 2) {
                // Enregistre définitivement le carré de droite
                box2.x = tempX;
                box2.y = tempY;

                // Fin du processus
                step = 3;
                adjustPanel.style.display = 'none';
                statusText.innerText = "✅ Calage terminé ! Image prête pour AcuTx.";
                btnDownload.style.display = 'block';
                btnRetry.style.display = 'block';
                redrawCanvas();
            }
        }

        btnRetry.addEventListener('click', function() {
            canvas.style.display = 'none';
            adjustPanel.style.display = 'none';
            btnDownload.style.display = 'none';
            btnRetry.style.display = 'none';
            btnShoot.style.display = 'block';
            fileInput.value = '';
            currentImg = null;
            step = 0;
            statusText.innerText = "1. Prenez la photo globale de la plaque.";
        });
    </script>
</body>
</html>
