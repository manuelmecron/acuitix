<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acuitix_Optix_V.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        #camera-stream {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        #orientation-warning .icon { font-size: 50px; margin-bottom: 15px; }

        #overlay-gabarit {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gabarit-box {
            position: relative;
            width: 70vw;
            max-width: 600px;
            height: calc(70vw * (100 / 170));
            max-height: 350px;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            transition: transform 0.1s ease-out;
        }

        .axe-x {
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 2px;
            background: red;
            transform: translateY(-50%);
        }

        .corner {
            position: absolute;
            width: 15%; height: 25%;
            border: 2px solid rgba(255, 255, 255, 0.9);
        }
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; }
        .bottom-left { bottom: 0; left: 0; }
        .bottom-right { bottom: 0; right: 0; }

        .marker {
            position: absolute;
            top: 50%;
            width: 30px; height: 30px;
            background: rgba(0, 255, 0, 0.4);
            border: 2px solid yellow;
            transform: translateY(-50%);
        }
        #marker-left { left: 20%; }
        #marker-right { left: 60%; }

        #controls-panel {
            position: absolute;
            bottom: 10px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            color: white;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .control-group { display: flex; flex-direction: column; align-items: center; font-size: 12px; }
        input[type=range] { width: 110px; }
        button {
            background: #28a745; color: white; border: none;
            padding: 10px 18px; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        button:active { background: #218838; }

        /* Modal d'affichage de la photo prise */
        #preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 20000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #preview-modal img {
            max-width: 90%;
            max-height: 70vh;
            border: 2px solid white;
            margin-bottom: 15px;
        }
        .modal-buttons { display: flex; gap: 10px; }
        .btn-secondary { background: #007bff; }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div class="icon">📱 ➡️ 🔄</div>
        <h2>Mode Paysage Requis</h2>
        <p>Veuillez basculer votre téléphone à l'horizontale pour utiliser Acuitix_Optix_V.1.</p>
    </div>

    <video id="camera-stream" autoplay playsinline></video>

    <div id="overlay-gabarit">
        <div class="gabarit-box" id="gabaritBox">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
            <div class="axe-x"></div>
            <div class="marker" id="marker-left"></div>
            <div class="marker" id="marker-right"></div>
        </div>
    </div>

    <div id="controls-panel">
        <div class="control-group">
            <label>Échelle Gabarit</label>
            <input type="range" id="scaleRange" min="0.5" max="1.5" step="0.05" value="1">
        </div>
        <div class="control-group">
            <label>Carré Droit (X)</label>
            <input type="range" id="rightPosRange" min="5" max="85" step="1" value="60">
        </div>
        <button id="snapButton">Prendre la photo</button>
    </div>

    <!-- Modale de résultat -->
    <div id="preview-modal">
        <img id="resultImage" alt="Photo capturée">
        <div class="modal-buttons">
            <button id="downloadBtn">Télécharger</button>
            <button id="shareBtn" class="btn-secondary">Partager</button>
            <button id="retryBtn" style="background: #dc3545;">Refaire</button>
        </div>
    </div>

    <canvas id="snapshotCanvas" style="display:none;"></canvas>

    <script>
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                document.getElementById('camera-stream').srcObject = stream;
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    document.getElementById('camera-stream').srcObject = stream;
                } catch (e) {
                    alert("Impossible d'accéder à la caméra : " + e.message);
                }
            }
        }

        function checkOrientation() {
            const warning = document.getElementById('orientation-warning');
            if (window.innerHeight > window.innerWidth) {
                warning.style.display = 'flex';
            } else {
                warning.style.display = 'none';
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(() => {});
                }
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('load', () => {
            initCamera();
            checkOrientation();
        });

        const gabaritBox = document.getElementById('gabaritBox');
        const scaleRange = document.getElementById('scaleRange');
        const rightPosRange = document.getElementById('rightPosRange');
        const markerRight = document.getElementById('marker-right');
        const markerLeft = document.getElementById('marker-left');

        let currentScale = 1;
        let rightPosPercent = 60;

        scaleRange.addEventListener('input', (e) => {
            currentScale = parseFloat(e.target.value);
            gabaritBox.style.transform = `scale(${currentScale})`;
        });

        rightPosRange.addEventListener('input', (e) => {
            rightPosPercent = parseFloat(e.target.value);
            markerRight.style.left = rightPosPercent + '%';
        });

        // Logique de capture de la photo + Incrustation vectorielle du gabarit
        document.getElementById('snapButton').addEventListener('click', () => {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('snapshotCanvas');
            
            // Adapter la taille du canvas à la résolution réelle de la vidéo
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            
            const ctx = canvas.getContext('2d');
            
            // 1. Dessiner la vidéo de la caméra
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. Calculer les dimensions et positions du gabarit proportionnellement sur le canvas
            const boxW = canvas.width * 0.7 * currentScale;
            const boxH = boxW * (100 / 170);
            const boxX = (canvas.width - boxW) / 2;
            const boxY = (canvas.height - boxH) / 2;

            ctx.save();

            // Dessiner le contour du rectangle principal
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 4;
            ctx.strokeRect(boxX, boxY, boxW, boxH);

            // Dessiner l'Axe X en ROUGE au milieu exact
            ctx.strokeStyle = "red";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(boxX, boxY + boxH / 2);
            ctx.lineTo(boxX + boxW, boxY + boxH / 2);
            ctx.stroke();

            // Dessiner les 4 coins (15% de largeur, 25% de hauteur du gabarit)
            const cW = boxW * 0.15;
            const cH = boxH * 0.25;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
            ctx.strokeRect(boxX, boxY, cW, cH); // Haut-Gauche
            ctx.strokeRect(boxX + boxW - cW, boxY, cW, cH); // Haut-Droit
            ctx.strokeRect(boxX, boxY + boxH - cH, cW, cH); // Bas-Gauche
            ctx.strokeRect(boxX + boxW - cW, boxY + boxH - cH, cW, cH); // Bas-Droit

            // Dessiner le carré gauche fixe (à 20% par exemple)
            const mSize = 30 * (boxW / 600); // Taille proportionnelle
            ctx.fillStyle = "rgba(0, 255, 0, 0.3)";
            ctx.strokeStyle = "yellow";
            ctx.lineWidth = 2;
            const leftX = boxX + (boxW * 0.2);
            ctx.fillRect(leftX, boxY + (boxH / 2) - (mSize / 2), mSize, mSize);
            ctx.strokeRect(leftX, boxY + (boxH / 2) - (mSize / 2), mSize, mSize);

            // Dessiner le carré droit mobile basé sur le slider
            const rightX = boxX + (boxW * (rightPosPercent / 100));
            ctx.fillRect(rightX, boxY + (boxH / 2) - (mSize / 2), mSize, mSize);
            ctx.strokeRect(rightX, boxY + (boxH / 2) - (mSize / 2), mSize, mSize);

            ctx.restore();

            // 3. Afficher le résultat dans la modale
            const imageURL = canvas.toDataURL('image/png');
            document.getElementById('resultImage').src = imageURL;
            document.getElementById('preview-modal').style.display = 'flex';

            // Configurer le bouton de téléchargement
            document.getElementById('downloadBtn').onclick = () => {
                const link = document.createElement('a');
                link.download = 'Acuitix_Optix_Capture.png';
                link.href = imageURL;
                link.click();
            };

            // Configurer le bouton de partage (si supporté par le mobile)
            document.getElementById('shareBtn').onclick = async () => {
                if (navigator.share) {
                    try {
                        const blob = await (await fetch(imageURL)).blob();
                        const file = new File([blob], 'Acuitix_Optix_Capture.png', { type: 'image/png' });
                        await navigator.share({
                            title: 'Acuitix Optix Capture',
                            text: 'Voici la photo calibrée avec le gabarit.',
                            files: [file]
                        });
                    } catch (err) {
                        console.log("Partage annulé ou non supporté", err);
                    }
                } else {
                    alert("Le partage direct n'est pas pris en charge par ce navigateur. Utilisez le bouton Télécharger.");
                }
            };
        });

        // Bouton pour refaire / fermer la modale
        document.getElementById('retryBtn').addEventListener('click', () => {
            document.getElementById('preview-modal').style.display = 'none';
        });
    </script>
</body>
</html>
